thread: thead12
status: reviewed
date_reviewed: 2026-09-27

summary: |
  A #131 (StorageResourceOracleCloud binding_surface/derivation_chain
  restatement) feloldása, miután cic-primitives#5 (Address key_fields
  formalizálás) lezárult 2026-09-26-án. A `backend` key_field biztonságosan
  szűkíthető volt per-érték conformance-szal (#137/thead11 mintája). A
  `provider` key_field NEM -- a bázison feltétel-függő jelentésű mező
  (backend értékétől függ), ami ugyanazt a kifejezőerő-hiányt hozza
  felszínre, amit cic-primitives#8/thead10 collection-elemekre már
  dokumentál, csak most egy scalar key_field szintjén.

  Az ELSŐ verzió itt megállt (csak `addresses[].key_fields` restate,
  `adapter`/`adapter_capabilities` explicit scope-on kívül hagyva). Egy
  külső AI-review (PR #149-en) helyesen mutatott rá, hogy ez saját magával
  ellentmondó: a fájl a coverage.py "explicit full restatement, nincs
  implicit öröklés" elvét idézi, majd egy RÉSZLEGES binding_surface-t hoz
  létre -- ha a hiányzó tagok öröklődnek, az implicit öröklés (amit az
  elv tilt); ha nem, a specializációnak nincs adaptere (abszurd). A
  helyesbített verzió a teljes binding_surface-t kiadja, és kimondja,
  hogy a surface két eltérő jellegű tartalmat kever: örökölt Shape-mező-
  lista (addresses.key_fields, mint a config_surface) vs. statikus
  tény-lista (adapter_capabilities.known_adapters, nem Shape-node) --
  ez utóbbinál a "teljes restatement" nem az összes bázis-bejegyzés
  megismétlését jelenti, hanem a specializációra ténylegesen érvényes
  tényhalmaz önálló kiadását.

accepted:
  - "cic-primitives#5 lezárása után a StorageResourceOracleCloud
    binding_surface.addresses[].key_fields.backend mezője biztonságosan
    szűkíthető per-érték conformance-szal (hypervisor/san ->
    not_implemented, cloud marad implemented) -- a bázison már létező,
    feltétlen Contract-enumra építve. Verifikálva: check_grammar.py 0
    finding, coverage.py check_coverage(major_bump=False) 0 violation."
  - "Egy role: key mezőn `default` beállítása grammar-hibát dob (C13:
    'a key identifies a list entry and is supplied by the requester;
    identity is never defaulted') -- CONFIRMED közvetlen futtatással.
    Helyesen: egy kulcs-azonosító sosem lehet implicit."
  - "A `provider` key_field NEM szűkíthető ugyanígy: a bázison a mező
    jelentése feltételes a szomszédos `backend` értékétől (hypervisor/san
    esetén szabad azonosító, csak cloud esetén valódi enum), ezért a
    bázison sincs feltétlen Contract-enum rajta. Erre a specializációra
    Contract-ot tenni tévesen a hypervisor/san eseteket is a cloud-enumra
    korlátozná a bázison -- ez nem workaround-dal megoldandó hiány, hanem
    egy UGYANAZON kifejezőerő-rés újabb megjelenése, amit
    cic-primitives#8/thead10 collection-elemekre már dokumentál, csak
    most egy `key_fields` alatti scalar Shape node szintjén."
  - "A helyes döntés emiatt: NEM bevezetni egy félrevezető strukturális
    szűkítést csak azért, mert a nyelv még nem tudja kifejezni a valódi
    'kontraktus feltételes egy szomszédos mező értékétől' mintát --
    ugyanaz az elv, mint a #146/thead10 döntésben."
  - "Külső review, 2. kör: a RÉSZLEGES binding_surface (csak addresses,
    adapter/adapter_capabilities kihagyva) saját magával ellentmondó a
    fájl saját 'explicit full restatement, nincs implicit öröklés'
    idézetével szemben -- CONFIRMED: coverage.py _NODE_LIST_KEYS
    valóban nem tartalmazza a binding_surface-t, tehát a '0 finding/0
    violation' korábbi hivatkozás nem bizonyította a specializáció
    binding-szemantikájának helyességét, csak azt, hogy az ellenőrzés
    nem néz bele."
  - "A helyesbítés: FULL restatement (a review három javasolt modellje
    közül -- explicit inherit-jelzés és structural overlay új,
    formalizálatlan kernel-mechanizmust igényelne, ezt nem lehet
    egyoldalúan bevezetni). Emellett kimondva: a binding_surface KÉT
    eltérő jellegű tartalmat kever -- addresses.key_fields örökölt
    Shape-mező-lista (mint config_surface), adapter_capabilities.
    known_adapters statikus tény-lista (nem Shape-node,
    check_grammar.py NODE_CONTAINERS sem kezeli ekként) -- ez utóbbinál
    a 'teljes restatement' a specializációra ténylegesen érvényes
    tényhalmaz önálló kiadását jelenti, nem az összes bázis-bejegyzés
    (hypervisor/san is) megismétlését."
  - "Mellékesen javítva: a bázis cloud-bejegyzésének capabilities
    listája tartalmazta a filesystem-et, holott config_surface.
    filesystem OCI-n not_implemented -- a specializáció
    known_adapters-bejegyzéséből ez most kimaradt."

rejected:
  - "default: oci a provider key_field-en, mint dokumentációs jelzés --
    elutasítva a grammar (C13) által: egy kulcs-mező azonosítóját sosem
    lehet defaultolni."
  - "adapter/adapter_capabilities kihagyása a scope-ból (ELSŐ verzió
    döntése) -- helyesbítve a 2. review kör után: saját magával
    ellentmondó volt, nem védhető scope-szűkítés."

