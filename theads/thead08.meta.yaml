thread: thead08
status: reviewed
date_reviewed: 2026-09-26

summary: |
  Egy beillesztett külső AI-review vizsgálata a HEAD 5351200-on
  (thead04-thead07 után). Négy konkrét állítás, mind ellenőrizve előbb,
  mielőtt bármit elfogadtunk volna: két valódi bug (kijavítva külön PR-ben,
  nem itt), és két mélyebb, nyitott kérdés (itt dokumentálva).

  A legfontosabb felismerés: a thead07/cic-schema-registry#137-ben
  javasolt `contract_narrowing: true` megoldás architekturálisan hibás
  lett volna (Liskov substitution violation) -- a helyes irány a YANG
  dialektus MÁR LÉTEZŐ per-value conformance mechanizmusának portolása a
  DomainComposition dialektusra, amit konkrét precedenssel (standards/
  yang/ietf-interfaces-vlan, #45-ös incidens) és kódszintű ellenőrzéssel
  (coverage.py _shape_signature() nem ismeri ezt a YANG-oldali
  toleranciát) is alátámasztottunk.

accepted:
  - "ComputeResource.operation_surface.resize.input.cpu_cores még mindig
    integer volt a #133 után -- CONFIRMED, kijavítva (fix/review-followup-
    resize-and-network-ref branch)."
  - "KubernetesCluster.control_plane_endpoint_policy.network_ref leírása
    elavult volt (Subnet séma létrejötte után nem frissült) -- CONFIRMED,
    kijavítva ugyanabban a PR-ben, semantic_type: cic-reference,
    reference_target: cic:network:Subnet."
  - "StorageResource.encryption_mode default: none inkonzisztens az
    OCI-specializáció saját dokumentációjával, ami szerint none OCI-n
    sosem fordul elő -- CONFIRMED mindkét fájlban."
  - "A contract_narrowing: true (thead07 saját javaslata) klasszikus
    Liskov substitution hibát vezetne be: egy legális base-szintű intent
    (encryption_mode: none) illegálissá válna a szűkített specializáción
    -- ez a review helyes, alapos kritikája volt."
  - "A per-value conformance (teljes vokabulárium + érték-szintű
    not_implemented) MÁR LÉTEZŐ, működő precedens a YANG dialektusban --
    CONFIRMED standards/yang/ietf-interfaces-vlan/
    ietf-interfaces-vlan.yaml:158-171, plusz egy valós, dokumentált
    incidens (#45 elkapta a v0.1.4-es csendes szűkítést) ugyanezzel a
    mintával megoldva."
  - "Ez a mechanizmus MA CSAK a YANG dialektusban létezik --
    tools/registrylib/coverage.py _shape_signature() (a DomainComposition-
    oldali, identity.base ellenőrzéseket futtató függvény) nyers
    tuple-egyezést csinál a contract mezőre, nincs benne a YANG-oldali
    _yang_enum_value_names()-hez hasonló érték-szintű tolerancia --
    CONFIRMED forráskódból."

