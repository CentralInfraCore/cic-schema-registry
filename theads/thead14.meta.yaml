    realizálódik a séma más technológiai rétegekben (YANG-modul,
    RESTCONF, futásidejű reconcile-loop) -- egyik sem kliens által
    beállítható mező, ellentétben a config_surface tartalmával."
  - "derivation_chain NEM univerzális minta: a session során létrehozott
    kubernetes-cluster/dhcp-service/network-space/subnet/dhcp-options
    egyike sem hordozza -- csak a három YANG-eredetű sémán él, opcionális
    dokumentációs blokkként."
  - "tools/registrylib/coverage.py _NODE_LIST_KEYS-ének kihagyása
    (config_surface/state_surface/operation_surface/notification_surface
    -re korlátozva) a fenti indoklás mellett HELYES viselkedés, nem
    vakfolt -- csak eddig nem volt kimondva, hogy szándékos. Most explicit
    megjegyzésben rögzítve."
  - "StorageResourceOracleCloud provider_resources fogalmilag rokon a
    derivation_chain.restconf-fal (ugyanaz a kérdés, provider-specifikus
    szinten) -- MEGFIGYELÉS, nem döntés: nincs konkrét tervezett
    egyesített forma, és nincs második provider-specializáció, ami a
    döntést ténylegesen indokolná."
  - "Külső review (PR #151-en) helyesen kapta el: az eredeti komment
    egy mondatba írta a derivation_chain-t (most eldöntött, szándékos
    kizárás) a binding_surface/policy_surface mellé (nyitott, nem
    eldöntött) -- ez tévesen sugallta, hogy mindhárom ugyanolyan alapon
    van kizárva a coverage.py-ból. Konkrétan a binding_surface esetében
    thead12/PR #149 pár nappal korábban kimutatta, hogy a kizárása ISMERT
    TOOLING GAP, nem szándékos döntés: ez tette lehetővé, hogy egy
    önmagával ellentmondó részleges restatement '0 violation'-t
    mutasson, amit csak egy külső review kapott el kézzel. Javítva: a
    komment most explicit szétválasztja a hármat."

