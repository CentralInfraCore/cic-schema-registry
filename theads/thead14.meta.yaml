summary: |
  cic-primitives#6 megválaszolása: a derivation_chain (storage-resource/
  compute-resource/network-interface, mindhárom yang/restconf/runtime
  hármas struktúrával) séma-provenance, nem domain-object szemantika --
  kívül marad a Shape/Access primitíveken. tools/registrylib/coverage.py
  meglévő kihagyása (nincs a _NODE_LIST_KEYS-ben) emiatt szándékos, most
  explicit megjegyzésben rögzítve. A provider_resources rokonsága
  megfigyelésként rögzítve, nem egyesítve.

accepted:
