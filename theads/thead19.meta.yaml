summary: |
  #154 "Canonical gaps" kategóriájának javítása (thead18 kategorizálása
  szerint) -- public_access description pontosítás, dns_label mező
  felvétele (Subnet + NetworkSpace), ipv6_cidr_block -> ipv6_cidr_blocks
  kardinalitás-javítás, dns_support_enabled/dns_hostnames_enabled
  pontosítás capability-jelöléssel, available_ip_count/subnet_count
  derived jelleg dokumentálása. A "Provider/modul gaps" (correspondence/
  subnet.json, AddVcnCidr) és a specializáció-építés kérdése nem ez a
  szál hatóköre.

accepted:
  - "public_access description szétválasztva: kizárólag public-IP-
