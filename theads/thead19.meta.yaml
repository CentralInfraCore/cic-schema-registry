summary: |
  #154 "Canonical gaps" kategóriájának javítása (thead18 kategorizálása
  szerint), egy review-körrel helyesbítve. public_access description
  pontosítás, dns_label mező felvétele (Subnet + NetworkSpace),
  ipv6_cidr_block -> ipv6_cidr_blocks kardinalitás-javítás,
  dns_support_enabled/dns_hostnames_enabled pontosítás capability-
  jelöléssel ÉS default eltávolítással, available_ip_count/subnet_count
  derived jelleg dokumentálása (konkrét, hibás levezetési képlet nélkül).
  A "Provider/modul gaps" (correspondence/subnet.json, AddVcnCidr) és a
  specializáció-építés kérdése nem ez a szál hatóköre.

accepted:
  - "public_access description szétválasztva: kizárólag public-IP-
    kiosztás, nem internet-elérés/routing."
  - "dns_support_enabled/dns_hostnames_enabled MEGTARTVA, nem törölve --
    a network-space.yaml fejléce explicit a scope részének mondja a
    DNS-beállítást, eltávolításuk szűkítette volna a deklarált scope-ot.
    capability: dns_toggles jelölve mindkettőn, description pontosítva
    (AWS-VPC-eredet, OCI-n nincs megfelelőjük)."
  - "Új dns_label mező mindkét objektumon (Subnet + NetworkSpace),
    capability: dns_label -- külön fogalom a dns_support_enabled/
    dns_hostnames_enabled kapcsolóktól, az OCI dnsLabel-stílusú
    névkomponenst fejezi ki. A canonical cél több provider eltérő
    DNS-mechanizmusát egyszerre kifejezni."
  - "ipv6_cidr_block -> ipv6_cidr_blocks, skalárról collection_variant:
    set-re -- a thead18 review-jában megerősített cross-provider
    bizonyíték alapján (AWS/Azure is listás IPv6-modellt használ)."
  - "available_ip_count (Subnet) és subnet_count (NetworkSpace)
    description-je kiegészítve: explicit jelölve derived/composition
    értékként, nincs közvetlen provider-forrás."
  - "secondary_cidr_blocks/add_secondary_cidr VÁLTOZATLAN -- thead18
    két review-köre után ez nem canonical hiba, provider/modul gap."
  - "Nincs verzióbump egyik fájlon sem -- mindkettő sosem lett még
    -src<év> release-ként kivágva. Verifikálva: check_grammar.py 0
    finding mindkét fájlon (20, 24 node)."
  - "Külső review a #156-on, PONT 1: available_ip_count eredeti
    levezetési képlete ('cidr_block mérete mínusz VNIC-ek száma')
    TÁRGYILAG HIBÁS volt még OCI-ra is -- egy VNIC OCI-n akár 64
    secondary private IP-t hordozhat, OCI subnetenként 3 címet
    fenntart infrastruktúra-célra. CONFIRMED, elfogadva, javítva:
    a description mostantól NEM ad meg konkrét algoritmust, csak a
    derived/composition jelleget mondja ki."
  - "Külső review, PONT 2: capability + default konfliktus, mélyebb
    kernel-szintű hiba. A capability mechanizmus ma nem formalizált
    (proposals/atom-grammar/README.md), nincs grammar-szabály, ami
    kikényszerítené hogy egy nem-univerzális capability-jű mező
    default-ja csak a capability-t támogató provider-eken
    injektálódjon -- egy default egy OCI-intent-be hamisan
    beledeklarálna egy AWS-fogalmat. CONFIRMED, elfogadva: default
    eltávolítva mindkét DNS-toggle mezőről (dns_support_enabled/
    dns_hostnames_enabled), 'hiányzás = nincs intent' elvre váltva.
    A kernel-szintű hiány (capability-mechanizmus formalizálatlansága)
    ezzel NEM oldódik meg, csak a konkrét kockázat ezen a két mezőn --
    dokumentálva mint továbbra is nyitott kerneladósság."

