summary: |
  Külső AI-review a #152-ről (KubernetesCluster/Node backend key_field,
  #25 feloldása) — jóváhagyta a fő döntést, nem blokkolta, de talált egy
  harmadik megjelenését a "mezők önálló validálása nem elég" mintaosztálynak:
  KubernetesNode binding_surface (beágyazott szülő-kulcs) és
  config_surface.cluster_ref (cic-reference ugyanarra a szülőre) között
  nincs konzisztencia-invariáns. Nem a #152 vezette be, csak láthatóbbá
  tette. Rögzítve cic-primitives#11-ként.

accepted:
