    (backend/provider/location/cluster_id) és
    KubernetesNode.config_surface.cluster_ref (cic-reference, teljes
    szülő logical_id) függetlenül validált -- nincs mechanizmus, ami
    kikényszerítené dereference(cluster_ref).logical_id ==
    compose(backend, provider, location, cluster_id). CONFIRMED
    közvetlen kódolvasással."
  - "Ez NEM a #152 által bevezetett hiba -- a cluster_id + cluster_ref
    kettősség már azelőtt is létezett, a #152 csak a teljes parent
    routing identity-t (backend+provider is) tette bekerülővé a gyerek
    address-be, ami láthatóbbá tette a mintát."
  - "Ellenőrizve: a Subnet/NetworkSpace pár NEM mutatja ezt a mintát --
    a Subnet binding_surface key_fields-je nem ágyazza be a
    network_space_ref célját, a kapcsolat kizárólag a cic-reference
