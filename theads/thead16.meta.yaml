    ismert eset, ahol egy gyerek address hierarchikusan ágyazza be a
    szülő teljes kulcsát ÉS emellett van külön cic-reference is
    ugyanarra a szülőre."
  - "Ez a harmadik megjelenése ugyanannak a mintaosztálynak, mint
    cic-primitives#8 (ref+vlan_id, megoldva item_choice-szal) és
    thead12 (key_fields.provider feltételes Contract, dokumentált,
    megoldatlan nyelvi hiány) -- 'mezők önálló validálása nem elég,
    relációs invariáns is kell', most két KÜLÖNBÖZŐ SURFACE (binding_surface
    vs config_surface) közötti kapcsolatra."
  - "Nem blokkoljuk vele a #152-t -- a review is így javasolta, egyetértek:
    előzetesen létező, nem e PR által bevezetett hiányosság, kernel-
    tervezési kérdés, nem corpus-fix."

