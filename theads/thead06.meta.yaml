    a formális kind megszületik. A worked example explicit leszögezi,
    hogy MA nem helyettesíti/generálja azt."
  - "Ha a formális kind mellett döntenek: a `mismatch: true` jelző
    validátor-szintű viselkedése (csak dokumentáció, vagy kötelező
    hivatkozás egy nyitott canonical-fix issue-ra)."
  - "A worked example kiterjesztése a többi öt canonical objektumra
    (ComputeResource, NetworkInterface, DHCPService/DHCPOptions,
    KubernetesCluster, KubernetesNode) — szándékosan nem történt meg,
    amíg a formátum maga nincs eldöntve."

