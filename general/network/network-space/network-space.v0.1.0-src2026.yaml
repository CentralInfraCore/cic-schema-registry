---
metadata:
  name: NetworkSpace
  version: v0.1.0
  description: >
    Provider-managed, isolált IP-hálózati tér — OCI VCN, AWS VPC, Azure
    VNet közös absztrakciója. Ez volt a legnagyobb konkrét coverage-rés,
    amit a thead04 OCI correspondence review talált: a `cic-module-
    oracle-cloud` extractor már ismeri a Vcn/Subnet objektumokat, de a
    registry `general/` rétegében nem volt canonical megfelelőjük —
    mindent a `NetworkInterface`-be próbáltak volna belepréselni, ami
    rossz absztrakció (NetworkInterface fizikai/logikai portot ír le,
    nem egy egész izolált hálózati teret).

    Scope: KIZÁRÓLAG a hálózati tér maga (cím-tartomány, DNS-beállítás,
    lifecycle). Route-olás (route-table/route), security (network-
    security-group/security-rule) és internet/NAT gateway-ek NEM
    tartoznak ide — ezek a thead04 által javasolt general/network/
    ontológia külön, még meg nem írt tagjai (route-table/, route/,
    network-security-group/, security-rule/, gateway/).

    Adapter: MÉG NINCS — a `binding_surface.adapter_capabilities.
    known_adapters` szándékosan üres/hiányzik, amíg egy valódi adapter
    (pl. cic-module-oracle-cloud VCN-implementációja) meg nem valósítja.

    binding_surface.addresses[].key_fields formalizált Shape+Role
    primitívekkel íródott (nem {name, type, values}) — lásd
    cic-primitives#5 és proposals/atom-grammar/README.md §2.7.

    v0.1.0: első release. Tartalmazza a #143 javítást (az
    add_secondary_cidr operation output.secondary_cidr_blocks mezője
    hiányzó item_fields miatt bukott a grammatikán — javítva
    `collection_variant: set` + `item_scalar_type: string`-re, sima
    cím-lista, nem kulcs-érték pár) és a thead18/#154 "Canonical gaps"
    javítását, amit a working copy még verzióbump nélkül hordozott:
    `ipv6_cidr_block` -> `ipv6_cidr_blocks`,
    skalárról `collection_variant: set`-re (kardinalitás-hiba — AWS
    és Azure is listás IPv6-modellt használ, nem csak OCI);
    `dns_support_enabled`/`dns_hostnames_enabled` description
    pontosítva (AWS-VPC-eredet, OCI-n nincs megfelelőjük,
    `capability: dns_toggles` jelölve); új `dns_label` mező (OCI
    `dnsLabel`-stílusú belső DNS-névkomponens, `capability: dns_label`);
    `subnet_count` description kiegészítve a derived/composition
    jelleg dokumentálásával. Megjegyzés: `secondary_cidr_blocks` +
    `add_secondary_cidr` (fentebb, #143) NEM lett hiba (thead18
    helyesbítése) — az OCI-nak van rá valódi action-je (`AddVcnCidr`),
    csak a cic-module-oracle-cloud modul nem generálta le még
    (provider/modul gap, nem canonical).
  owner: Gabor Zoltan Sinko
  tags:
    - domain-composition
    - network
  validatedBy:
    name: cic-primitives
    version: v0.2.0

spec:
  kind: DomainComposition
  base:
    aggregate: ManagedEntity
    ref: "cic:core:ManagedEntity@v0.2.0"

  # ── PolicySurface — Access atom alapú jogosultság (cic-primitives D-011) ────
  policy_surface:
    default_access: open
    default_modify: owner
    surface_rules:
      - surface: state_surface
        modify: [OU=adapters, O=cic]
      - surface: config_surface
        access: [O=owner]
        modify: [O=owner]
    inherit_policy: true

  # ── Identity ─────────────────────────────────────────────────────────────────
  identity:
    atomic_ref: "cic:core:Identity@v0.2.0"
    kind: NetworkSpace
    namespace: "cic:network"
    version: v0.1.0
    base: "cic:core:ManagedEntity@v0.2.0"
    abstract: false
    description: Provider-managed, isolált IP-hálózati tér (VCN/VPC/VNet)

  # ── ConfigSurface ─────────────────────────────────────────────────────────────
  config_surface:
    aggregate_ref: "cic:core:ConfigSurface@v0.2.0"
    nodes:

      - name: cidr_block
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: string
        role: config
        mandatory: true
        description: Elsődleges IPv4 CIDR blokk (pl. 10.0.0.0/16)
        contract:
          - type: pattern
            expression: "^([0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,2}$"

      - name: secondary_cidr_blocks
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: collection
        collection_variant: list
        role: config
        optional: true
        capability: secondary_cidr
        description: >
          További, utólag hozzáadott CIDR blokkok (pl. AWS VPC CIDR
          association, OCI VCN CIDR block add) — nem minden provider/
          backend támogatja.
        item_fields:
          - name: cidr
            shape_type: scalar
            scalar_type: string
            role: key

      - name: ipv6_enabled
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: boolean
        role: config
        optional: true
        capability: ipv6
        description: >
          IPv6 CIDR blokk hozzárendelve-e. A tényleges blokkot a provider
          osztja ki (lásd state_surface.ipv6_cidr_blocks) — ez csak az
          engedélyezést jelöli, ahogy a cic-module-oracle-cloud
          isIpv6Enabled <- ipv6CidrBlocks derivációja is mutatja.
          SZÁNDÉKOSAN NINCS `default` (külső review után, thead19,
          ugyanaz az indoklás, mint dns_support_enabled/
          dns_hostnames_enabled-nél): `optional` + nem-univerzális
          `capability` + `default` ugyanaz a kockázatos kombináció --
          egy `default: false` is hamis intentet injektálna egy olyan
          providerre, ahol az `ipv6` capability nem támogatott (a
          `false` itt nem "no-op", hanem egy MEGKÜLÖNBÖZTETHETETLEN
          harmadik szemantikát venne fel a "nincs intent" és a "mező
          nem alkalmazható" mellett). Hiányzás = nincs róla intent.

      - name: dns_support_enabled
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: boolean
        role: config
        optional: true
        capability: dns_toggles
        description: >
          Belső DNS feloldás engedélyezve-e a hálózati térben. AWS
          VPC-stílusú fogalom (`enableDnsSupport`) -- OCI-n nincs
          hasonló, önálló be/ki kapcsoló, ott a `dns_label` mező
          jelenléte/hiánya és a belső DNS-zóna implicit módon együtt
          jár a hálózati tér létezésével. `capability: dns_toggles`
          jelöli, hogy ez a mező-pár nem minden providernél
          alkalmazható (thead18, #154). SZÁNDÉKOSAN NINCS `default`
          (külső review után, thead19): a `capability` mechanizmus ma
          nem formalizált (proposals/atom-grammar/README.md "Amit
          szándékosan NEM zárok le") és nem tudja kikényszeríteni,
          hogy egy nem-univerzális capability-jű mező default-ja csak
          a capability-t ténylegesen támogató provider-eken
          injektálódjon -- egy `default` itt egy OCI-alapú intent-be
          hamisan beledeklarálna egy AWS-fogalmat, amit a provider nem
          is ismer. `optional`, `default` nélkül: hiányzás = nincs róla
          intent, nem egy kitalált érték.

      - name: dns_hostnames_enabled
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: boolean
        role: config
        optional: true
        capability: dns_toggles
        description: >
          Automatikus DNS hostname kiosztás engedélyezve-e. AWS
          VPC-stílusú fogalom (`enableDnsHostnames`) -- ugyanaz a
          korlát, mint `dns_support_enabled`-nél: OCI-n nincs
          megfelelője, lásd ott. Ugyanazon okból NINCS `default` itt
          sem.

      - name: dns_label
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: string
        role: config
        optional: true
        capability: dns_label
        description: >
          Belső DNS-feloldáshoz használt névkomponens (pl. OCI `Vcn.
          dnsLabel`, create-only) -- KÜLÖN fogalom a
          `dns_support_enabled`/`dns_hostnames_enabled` be/ki
          kapcsolóktól, lásd azok leírását. `capability: dns_label`
          jelöli, hogy nem minden provider exponálja (thead18, #154).

      - name: tags
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: collection
        collection_variant: list
        role: config
        optional: true
        capability: tagging
        description: Platform tag-ek
        item_fields:
          - name: key
            shape_type: scalar
            scalar_type: string
            role: key
          - name: value
            shape_type: scalar
            scalar_type: string

  # ── StateSurface ──────────────────────────────────────────────────────────────
  state_surface:
    aggregate_ref: "cic:core:StateSurface@v0.2.0"
    source: "provider-specific — see binding_surface.adapter_capabilities"
    freshness:
      ttl: 60s
      strategy: event-driven
    nodes:

      - name: lifecycle_state
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: string
        role: state
        mandatory: true
        description: A hálózati tér életciklus-állapota
        contract:
          - type: enum
            expression: [pending, available, deleting, deleted, unknown]

      - name: ipv6_cidr_blocks
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: collection
        collection_variant: set
        item_scalar_type: string
        role: state
        optional: true
        capability: ipv6
        description: >
          A provider által kiosztott IPv6 CIDR blokk(ok) (ha
          ipv6_enabled). KARDINALITÁS-JAVÍTÁS (thead18, #154, korábban
          `ipv6_cidr_block` néven, skalárként): ez NEM csak OCI-n lista
          (`ipv6CidrBlocks`) -- az AWS VPC is több (dokumentáció szerint
          akár öt) IPv6 CIDR blokkot enged VPC-nként, az Azure virtuális
          hálózat address-space modellje is listás (`AddressPrefixes`).
          Egy skalár mező tehát ÁLTALÁNOSAN, nem csak OCI-specifikusan,
          túl szűk volt.

      - name: subnet_count
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: integer
        role: operational
        optional: true
        description: >
          A hálózati térben jelenleg létező Subnet-ek száma. DERIVED/
          COMPOSITION érték -- a legtöbb provider API-ja (pl. OCI Vcn)
          nem ad vissza ilyen mezőt közvetlenül; az adapter felelőssége
          egy külön subnet-lista lekérdezésből összeállítani (thead18,
          #154). Nincs garantált, egységes forrás minden providernél --
          optional emiatt is.

  # ── OperationSurface ──────────────────────────────────────────────────────────
  operation_surface:
    aggregate_ref: "cic:core:OperationSurface@v0.2.0"
    operations:

      - name: provision
        atomic_ref: "cic:core:Behavior@v0.2.0"
        type: operation
        idempotent: false
        description: Új hálózati tér létrehozása
        input:
          - name: cidr_block
            shape_type: scalar
            scalar_type: string
            mandatory: true
        output:
          - name: lifecycle_state
            shape_type: scalar
            scalar_type: string

      - name: add_secondary_cidr
        atomic_ref: "cic:core:Behavior@v0.2.0"
        type: operation
        idempotent: false
        capability: secondary_cidr
        description: További CIDR blokk hozzáadása a hálózati térhez
        input:
          - name: cidr
            shape_type: scalar
            scalar_type: string
            mandatory: true
        output:
          - name: secondary_cidr_blocks
            shape_type: collection
            collection_variant: set
            item_scalar_type: string

      - name: delete
        atomic_ref: "cic:core:Behavior@v0.2.0"
        type: operation
        idempotent: false
        description: "Hálózati tér végleges törlése — MANUAL ONLY (confirm: mandatory)"
        input:
          - name: confirm
            shape_type: scalar
            scalar_type: boolean
            mandatory: true
            contract:
              - type: must
                expression: "confirm = true()"
                error_message: >
                  A törlés csak explicit confirm: true mellett hajtható
                  végre.
        output: null

  # ── NotificationSurface ───────────────────────────────────────────────────────
  notification_surface:
    events:
      - name: lifecycle-state-changed
        atomic_ref: "cic:core:Event@v0.2.0"
        trigger: state_change
        severity: info
        description: A hálózati tér életciklus-állapota megváltozott
        payload:
          - name: previous_state
            shape_type: scalar
            scalar_type: string
          - name: current_state
            shape_type: scalar
            scalar_type: string

  # ── BindingSurface ────────────────────────────────────────────────────────────
  binding_surface:
    addresses:
      - atomic_ref: "cic:core:Address@v0.2.0"
        schema_path: "/cic-network:network-spaces/network-space={backend}, {provider}, {location}, {id}"
        api_path: "/restconf/data/cic-network:network-spaces/network-space={backend}, {provider}, {location}, {id}"
        logical_id: "cic:network:{backend}:{provider}:{location}:{id}"
        namespace: "cic:network"
        key_fields:
          - name: backend
            atomic_ref: "cic:core:Shape@v0.2.0"
            shape_type: scalar
            scalar_type: string
            role: key
            mandatory: true
            contract:
              - type: enum
                expression: [cloud]
            description: >
              Ma kizárólag cloud backend — hypervisor/san-szerű on-prem
              megfelelő (pl. Proxmox SDN zóna) még nincs modellezve.
          - name: provider
            atomic_ref: "cic:core:Shape@v0.2.0"
            shape_type: scalar
            scalar_type: string
            role: key
            mandatory: true
            description: "cloud provider enum-szerű értéke (pl. aws, gcp, azure, hcloud, do, ovh, oci)"
          - name: location
            atomic_ref: "cic:core:Shape@v0.2.0"
            shape_type: scalar
            scalar_type: string
            role: key
            mandatory: true
            description: Provider region (pl. eu-central-1)
          - name: id
            atomic_ref: "cic:core:Shape@v0.2.0"
            shape_type: scalar
            scalar_type: string
            role: key
            mandatory: true
            description: >
              A hálózati tér egyedi azonosítója (pl. OCI VCN OCID, AWS
              VPC ID, Azure VNet resource ID)
    adapter_capabilities:
      known_adapters: []
      note: >
        Üres szándékosan — nincs még execution-layer adapter (pl. egy OCI
        VCN-implementáció), az adat-oldali munka jelenlegi fókusza.
