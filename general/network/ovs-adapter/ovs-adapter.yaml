# WORKING COPY — not a versioned, signed release file (no -src<year>
# suffix, so tools/registrylib's filename pattern and all registry
# tooling ignore this file entirely: make check/registry_validate/
# generate_latest/signing never see it).
#
# This is the editable source of truth: the latest release
# (ovs-adapter.v0.4.2-src2026.yaml) is frozen and signed, so it can
# never be edited in place (tools/generate_latest.py
# check_no_frozen_edits). Changes happen HERE first; when ready, a new
# ovs-adapter.vX.Y.Z-src<year>.yaml is cut FROM this file's current
# content and signed.
#
# Identical to ovs-adapter.v0.4.2-src2026.yaml except the
# release:/cic_countersign: signature blocks are omitted (this file is
# not itself a signed artifact).
---
metadata:
  name: ovs-adapter
  version: v0.4.2
  description: >
    OVS / Linux bridge adapter contract — Open vSwitch és Linux bridge alapú
    szoftveres hálózat hypervisor környezetben. cic-yang building blockok kompozíciója.
    Ez a séma egyszerre az interface contract ÉS a conformance deklaráció.
    v0.4.2: ietf-interfaces-vlan lecserélve a #47 szerint szétválasztott
    ietf-interfaces-l2vlan (VLAN interfész-entitás) + cic-switchport-vlan
    (switchport VLAN policy) blokk-párra. A régi ietf-interfaces-vlan
    változatlan marad a registryben, csak ez az adapter már nem
    referenciázza.
  owner: Gabor Zoltan Sinko
  tags:
    - adapter-contract
    - network
    - ovs
    - linux-bridge
  validatedBy:
    name: cic-primitives
    version: v0.1.3

spec:
  kind: AdapterContract
  domain: "cic:network:NetworkInterface"

  yang_composition:
    blocks:
      - block: ietf-interfaces-logical
        source: cic-yang@v0.1.0
        reason: OVS bridge, Linux bridge, loopback kezelés
      - block: ietf-interfaces-l2vlan
        source: cic-schema-registry
        reason: >
          VLAN interfész-entitás (vlan_id, name, dhcp_service). #47 szerint
          kiválasztva a korábbi ietf-interfaces-vlan blokkból.
      - block: cic-switchport-vlan
        source: cic-schema-registry
        reason: >
          Switchport VLAN policy OVS portokon — access/trunk/hybrid,
          allowed_vlans, native_vlan. #47 szerint kiválasztva a korábbi
          ietf-interfaces-vlan blokkból.
      - block: ietf-interfaces-tunnel
        source: cic-yang@v0.1.0
        reason: VXLAN tunnel portok (OVS native VXLAN)
      - block: ietf-ip-v4
        source: cic-yang@v0.1.0
        reason: IPv4 konfiguráció bridge/loopback interfészeken
      - block: ietf-ip-v6
        source: cic-yang@v0.1.0
        reason: IPv6 konfiguráció bridge/loopback interfészeken
    note: >
      ietf-interfaces-physical NEM szerepel — az OVS adapter szoftveres
      interfészeket kezel. A fizikai uplink portot a switch-netconf-adapter kezeli.

  backends:
    - name: ovs
      description: OVS / Linux bridge szoftveres switch hypervisoron
      protocol: OVS-VSCTL / OVSDB (RFC 7047) / iproute2
      known_implementations:
        - Open vSwitch (OVS-VSCTL)
        - Linux bridge (iproute2/ip link)
        - Proxmox VE network API

  operations:
    - name: observe
      description: >
        OVS bridge/port állapotának lekérdezése OVS-VSCTL vagy OVSDB-n.
        Visszaad egy NetworkInterface state_surface-t.
        Adapter normalizálja: OVS 'LINK_UP' → oper_status: up
      input:
        - name: backend
          type: string
        - name: provider
          type: string
        - name: location
          type: string
        - name: id
          type: string
      output:
        ref: NetworkInterface.state_surface

    - name: apply
      description: >
        Config alkalmazása OVS-VSCTL parancsokkal vagy OVSDB tranzakcióval.
        Idempotens — adapter diff alapján alkalmaz.
        Nem implementált mezőre write → hard reject (D-012).
      input:
        ref: NetworkInterface.config_surface
      output:
        - name: applied
          type: boolean

    - name: watch
      description: >
        OVSDB monitor stream — bridge/port állapotváltozások.
        Eredmény: NetworkInterface notification_surface eventjei.
      output:
        stream: true
        ref: NetworkInterface.notification_surface

  not_implemented_fields:
    description: >
      Ezek a NetworkInterface mezők NINCSENEK ebben az adapter sémában.
      Write kísérlet → "field not implemented on OVS adapter" (D-012 hard reject).
    fields:
      - speed           # szoftveres interfészen nem értelmezhető
      - duplex          # szoftveres interfészen nem értelmezhető
