---
metadata:
  name: NetworkInterface
  version: v0.4.4
  description: >
    Egységes hálózati interfész erőforrás — fizikai switch port, logikai interfész
    (OVS bridge, loopback), VLAN szegmens és tunnel (VXLAN/GRE) egyaránt leírható.
    RFC 8343 (ietf-interfaces) alapú, cic-yang building blockok felhasználásával.

    Scope: L2 switching és overlay hálózat. Service réteg (routing protokollok,
    NAT, DHCP szerver, cloud VPC) — NEM ide tartozik.

    A type mező (RFC 8343 ifType alapján) határozza meg a konkrét interfész kategóriát.
    A platform különbség (fizikai switch vs OVS vs Linux bridge) az adapter rétegben van.

    v0.4.2: ietf-interfaces-vlan lecserélve a #47 szerint szétválasztott
    ietf-interfaces-l2vlan + cic-switchport-vlan blokk-párra, mind a
    yang_refs listában, mind a switch-netconf-adapter yang_blocks
    referenciájában — összhangban a switch-netconf-adapter.v0.4.2/
    ovs-adapter.v0.4.2 migrációval.

    v0.4.3: state_surface.source és binding_surface.adapter placeholder
    mezői (network-adapter — nem létező adapter-név) törölve, ugyanaz a
    minta, mint #27 a compute-resource-nál. A valós útválasztás
    binding_surface.adapter_capabilities.known_adapters-en megy
    (switch-netconf-adapter, ovs-adapter). Lásd #98.
  owner: Gabor Zoltan Sinko
  tags:
    - domain-composition
    - network
    - rfc8343
  validatedBy:
    name: cic-primitives
    version: v0.2.0

spec:
  kind: DomainComposition
  base:
    aggregate: ManagedEntity
    ref: "cic:core:ManagedEntity@v0.2.0"

  yang_refs:
    - block: ietf-interfaces-base
      source: cic-yang@v0.1.3
    - block: ietf-interfaces-physical
      source: cic-yang@v0.1.3
    - block: ietf-interfaces-logical
      source: cic-yang@v0.1.3
    - block: ietf-interfaces-l2vlan
      source: cic-schema-registry
    - block: cic-switchport-vlan
      source: cic-schema-registry
    - block: ietf-interfaces-tunnel
      source: cic-yang@v0.1.3
    - block: ietf-ip-v4
      source: cic-yang@v0.1.3
    - block: ietf-ip-v6
      source: cic-yang@v0.1.3
    - block: ietf-lldp
      source: cic-yang@v0.1.3

  # ── PolicySurface ─────────────────────────────────────────────────────────────
  policy_surface:
    default_access: open
    default_modify: owner
    surface_rules:
      - surface: state_surface
        modify: [OU=adapters, O=cic]
      - surface: config_surface
        access: [O=owner]
        modify: [O=owner]
    inherit_policy: true

  # ── Identity ─────────────────────────────────────────────────────────────────
  identity:
    atomic_ref: "cic:core:Identity@v0.2.0"
    kind: NetworkInterface
    namespace: "cic:network"
    version: v0.3.dev
    base: "cic:core:ManagedEntity@v0.2.0"
    abstract: false
    description: RFC 8343 alapú hálózati interfész erőforrás

  # ── ConfigSurface ─────────────────────────────────────────────────────────────
  config_surface:
    aggregate_ref: "cic:core:ConfigSurface@v0.2.0"
    yang_source: ietf-interfaces-base (cic-yang@v0.1.3)
    nodes:

      # ── Core (ietf-interfaces-base) ──────────────────────────────────────────
      - name: type
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: string
        role: config
        mandatory: true
        description: >
          RFC 8343 ifType alapú interfész kategória.
          physical: Ethernet port, LAG/bond (ethernetCsmacd, ieee8023adLag)
          logical: bridge, loopback, SVI (softwareLoopback, bridge, other)
          vlan: L2 VLAN szegmens (l2vlan) — mindig szülőhöz kötött
          tunnel: VXLAN, GRE, IPIP encapsulation
          bond: port-channel, LACP aggregáció (ieee8023adLag)
          loopback: loopback interfész (softwareLoopback)
        contract:
          - type: enum
            expression: [physical, logical, vlan, tunnel, bond, loopback]

      - name: description
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: string
        role: config
        optional: true
        description: Emberi olvasható leírás

      - name: enabled
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: boolean
        role: config
        optional: true
        default: true
        description: Adminisztrációs állapot

      - name: mtu
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: integer
        role: config
        optional: true
        default: 1500
        contract:
          - type: range
            expression: "68..9216"

      # ── Physical-specifikus (ietf-interfaces-physical) ────────────────────────
      - name: speed
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: integer
        role: config
        optional: true
        capability: physical
        description: Konfigurált port sebesség (Mbps) — null = auto-negotiate

      - name: duplex
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: string
        role: config
        optional: true
        default: auto
        capability: physical
        contract:
          - type: enum
            expression: [full, half, auto]

      # ── Typed sub-collections ─────────────────────────────────────────────────

      - name: vlans
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: collection
        collection_variant: list
        role: config
        optional: true
        description: >
          VLAN szegmensek ezen az interfészen (ietf-interfaces-vlan alapján).
          Minden elem: ref (CIC address) VAGY inline VLAN definíció.
          applicable_when: type in [physical, logical, bond]
        item_fields:
          - name: ref
            shape_type: scalar
            scalar_type: string
            optional: true
            description: CIC address pointer — ha meg van adva, az inline mezők opcionálisak
          - name: vlan_id
            shape_type: scalar
            scalar_type: integer
            optional: true
            description: VLAN azonosító (1-4094) — kötelező ha ref nincs megadva
          - name: vlan_mode
            shape_type: scalar
            scalar_type: string
            optional: true
            default: access
            contract:
              - type: enum
                expression: [access, trunk, hybrid]
          - name: allowed_vlans
            shape_type: collection
            collection_variant: list
            optional: true
            description: Engedélyezett VLAN ID-k trunk módban
          - name: dhcp_service
            shape_type: scalar
            scalar_type: string
            optional: true
            description: DHCP service CIC address referencia (service réteg)

      - name: logical_interfaces
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: collection
        collection_variant: list
        role: config
        optional: true
        description: >
          Logikai subinterfészek / SVI-k (ietf-interfaces-logical + ietf-ip-v4/v6 alapján).
          Minden elem: ref VAGY inline logikai interfész definíció + opcionális IP konfig.
          applicable_when: type in [physical, logical, bond]
        item_fields:
          - name: ref
            shape_type: scalar
            scalar_type: string
            optional: true
            description: CIC address pointer megosztott logikai interfészre
          - name: logical_type
            shape_type: scalar
            scalar_type: string
            optional: true
            contract:
              - type: enum
                expression: [subinterface, svi, other]
          - name: vlan_ref
            shape_type: scalar
            scalar_type: integer
            optional: true
            description: VLAN ID amire ez a logikai interfész épül
          - name: ip
            shape_type: object
            optional: true
            description: IP konfiguráció (ietf-ip-v4/v6 alapján, netplan-kompatibilis)
            properties:
              - name: addresses
                shape_type: collection
                collection_variant: list
                optional: true
                description: Statikus IP cím(ek) CIDR formátumban (IPv4 és/vagy IPv6)
              - name: gateway4
                shape_type: scalar
                scalar_type: string
                optional: true
                description: Default IPv4 gateway
              - name: gateway6
                shape_type: scalar
                scalar_type: string
                optional: true
                description: Default IPv6 gateway
              - name: nameservers
                shape_type: object
                optional: true
                properties:
                  - name: addresses
                    shape_type: collection
                    collection_variant: list
                    optional: true
                  - name: search
                    shape_type: collection
                    collection_variant: list
                    optional: true
              - name: routes
                shape_type: collection
                collection_variant: list
                optional: true
                description: Statikus route-ok
                item_fields:
                  - name: to
                    shape_type: scalar
                    scalar_type: string
                    role: key
                  - name: via
                    shape_type: scalar
                    scalar_type: string
                    optional: true
                  - name: metric
                    shape_type: scalar
                    scalar_type: integer
                    optional: true
                    default: 100
              - name: dhcp4
                shape_type: scalar
                scalar_type: boolean
                optional: true
                default: false
              - name: dhcp6
                shape_type: scalar
                scalar_type: boolean
                optional: true
                default: false
              - name: accept_ra
                shape_type: scalar
                scalar_type: boolean
                optional: true
                default: true

      - name: vxlans
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: collection
        collection_variant: list
        role: config
        optional: true
        description: >
          VXLAN tunnel interfészek (ietf-interfaces-tunnel alapján).
          applicable_when: type in [logical, bridge]
        item_fields:
          - name: ref
            shape_type: scalar
            scalar_type: string
            optional: true
            description: CIC address pointer megosztott tunnel definícióra
          - name: vni
            shape_type: scalar
            scalar_type: integer
            optional: true
            description: VXLAN Network Identifier (1-16777215)
          - name: local_endpoint
            shape_type: scalar
            scalar_type: string
            optional: true
            description: Helyi tunnel végpont IP cím (IPv4 vagy IPv6)
          - name: remote_endpoint
            shape_type: scalar
            scalar_type: string
            optional: true
            description: Távoli tunnel végpont — point-to-point vagy multicast
          - name: learning
            shape_type: scalar
            scalar_type: boolean
            optional: true
            default: true
            description: MAC learning — false = BGP EVPN vezérelt
          - name: ip
            shape_type: object
            optional: true
            description: IP konfiguráció a tunnel interfészen (netplan-kompatibilis)

      # ── STP / Spanning Tree (capability: stp) ────────────────────────────────
      - name: stp
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: object
        role: config
        optional: true
        capability: stp
        description: Spanning Tree Protocol konfiguráció (IEEE 802.1D/Q/w/s)
        properties:
          - name: enabled
            shape_type: scalar
            scalar_type: boolean
            default: true
          - name: mode
            shape_type: scalar
            scalar_type: string
            contract:
              - type: enum
                expression: [stp, rstp, mstp]
            default: rstp
          - name: port_priority
            shape_type: scalar
            scalar_type: integer
            default: 128
            description: STP port prioritás (0-240, 16-os lépésekben)
          - name: path_cost
            shape_type: scalar
            scalar_type: integer
            optional: true
            description: STP path cost (null = auto, sebességből számított)
          - name: edge_port
            shape_type: scalar
            scalar_type: boolean
            default: false
            description: Edge port / PortFast — uplink nélküli végpont portok
          - name: bpdu_guard
            shape_type: scalar
            scalar_type: boolean
            default: false
            description: BPDU Guard — edge porton BPDU érkezésekor port shutdown
          - name: bpdu_filter
            shape_type: scalar
            scalar_type: boolean
            default: false
            description: BPDU Filter — BPDU küldés/fogadás tiltása
          - name: root_guard
            shape_type: scalar
            scalar_type: boolean
            default: false
            description: Root Guard — megakadályozza hogy ez a port root legyen

      # ── PoE (capability: poe) ─────────────────────────────────────────────────
      - name: poe
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: object
        role: config
        optional: true
        capability: poe
        description: Power over Ethernet konfiguráció (IEEE 802.3at/bt)
        properties:
          - name: enabled
            shape_type: scalar
            scalar_type: boolean
            default: true
          - name: mode
            shape_type: scalar
            scalar_type: string
            contract:
              - type: enum
                expression: [auto, static, never]
            default: auto
            description: auto=eszköz igénye alapján, static=fix osztás, never=tiltott
          - name: priority
            shape_type: scalar
            scalar_type: string
            contract:
              - type: enum
                expression: [low, high, critical]
            default: low
            description: PoE prioritás — teljesítmény túllépésnél alacsony prioritású portok zárnak le
          - name: power_limit_mw
            shape_type: scalar
            scalar_type: integer
            optional: true
            description: Maximum kiosztott teljesítmény milliwattban (null = automatikus)

      # ── Storm control (capability: storm_control) ─────────────────────────────
      - name: storm_control
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: object
        role: config
        optional: true
        capability: storm_control
        description: Broadcast/multicast flood korlát
        properties:
          - name: broadcast_threshold_pct
            shape_type: scalar
            scalar_type: integer
            optional: true
            description: Broadcast forgalom maximum sávszélesség %-ban (1-100)
          - name: multicast_threshold_pct
            shape_type: scalar
            scalar_type: integer
            optional: true
            description: Multicast forgalom maximum sávszélesség %-ban
          - name: unknown_unicast_threshold_pct
            shape_type: scalar
            scalar_type: integer
            optional: true
            description: Unknown unicast maximum sávszélesség %-ban
          - name: action
            shape_type: scalar
            scalar_type: string
            contract:
              - type: enum
                expression: [drop, shutdown]
            default: drop
            description: Küszöb átlépésekor — drop=forgalom eldobás, shutdown=port leállítás

      # ── QinQ / 802.1ad (capability: qinq) ────────────────────────────────────
      - name: qinq
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: object
        role: config
        optional: true
        capability: qinq
        description: "QinQ double tagging konfiguráció (IEEE 802.1ad)"
        properties:
          - name: enabled
            shape_type: scalar
            scalar_type: boolean
            default: false
          - name: outer_vlan_id
            shape_type: scalar
            scalar_type: integer
            optional: true
            description: Külső VLAN tag (service VLAN / S-VLAN, 1-4094)
          - name: inner_vlan_id
            shape_type: scalar
            scalar_type: integer
            optional: true
            description: Belső VLAN tag (customer VLAN / C-VLAN, 1-4094)
          - name: tpid
            shape_type: scalar
            scalar_type: string
            default: "0x88a8"
            description: "Külső tag TPID — 0x88a8 (IEEE 802.1ad) vagy 0x8100 (legacy)"

      # ── LACP részletek (capability: lacp) ────────────────────────────────────
      - name: lacp
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: object
        role: config
        optional: true
        capability: lacp
        description: LACP (Link Aggregation Control Protocol) részletes konfiguráció
        properties:
          - name: interval
            shape_type: scalar
            scalar_type: string
            contract:
              - type: enum
                expression: [fast, slow]
            default: slow
            description: "LACP PDU küldési intervallum — fast: 1s, slow: 30s"
          - name: system_priority
            shape_type: scalar
            scalar_type: integer
            default: 32768
            description: LACP rendszer prioritás (1-65535, kisebb = magasabb prioritás)
          - name: port_priority
            shape_type: scalar
            scalar_type: integer
            default: 32768
            description: LACP port prioritás (1-65535)
          - name: min_links
            shape_type: scalar
            scalar_type: integer
            default: 1
            description: Minimális aktív taginterfészek száma — alatta a LAG leáll
          - name: max_links
            shape_type: scalar
            scalar_type: integer
            optional: true
            description: Maximum aktív taginterfészek száma (null = korlátlan)

      # ── LLDP (capability: lldp) ───────────────────────────────────────────────
      - name: lldp
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: object
        role: config
        optional: true
        capability: lldp
        description: LLDP konfiguráció (RFC 8516, ietf-lldp cic-yang@v0.1.3)
        properties:
          - name: enabled
            shape_type: scalar
            scalar_type: boolean
            default: true
          - name: transmit
            shape_type: scalar
            scalar_type: boolean
            default: true
          - name: receive
            shape_type: scalar
            scalar_type: boolean
            default: true
          - name: tlvs
            shape_type: collection
            collection_variant: list
            optional: true
            description: Hirdetett TLV-k (system-name, port-description, management-address stb.)

      # ── Port mirroring / SPAN (capability: port_mirror) ──────────────────────
      - name: port_mirror
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: object
        role: config
        optional: true
        capability: port_mirror
        description: Port tükrözés / SPAN — forgalom másolása monitoring portra
        properties:
          - name: enabled
            shape_type: scalar
            scalar_type: boolean
            default: false
          - name: direction
            shape_type: scalar
            scalar_type: string
            contract:
              - type: enum
                expression: [rx, tx, both]
            default: both
            description: Tükrözött forgalom iránya
          - name: destination
            shape_type: scalar
            scalar_type: string
            description: Célport interface neve ahová a tükrözött forgalom megy

      # ── Szülő-gyerek reláció (RFC 8343 higher/lower-layer-if) ─────────────────
      - name: lower_layer_if
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: collection
        collection_variant: list
        role: config
        optional: true
        description: >
          Alsó réteg interfészek — OVS bridge esetén az uplink port,
          bond esetén a taginterfészek nevei.
        item_fields:
          - name: name
            shape_type: scalar
            scalar_type: string
            role: key

  # ── StateSurface ──────────────────────────────────────────────────────────────
  state_surface:
    aggregate_ref: "cic:core:StateSurface@v0.2.0"
    freshness:
      ttl: 30s
      strategy: event-driven
    nodes:

      - name: oper_status
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: string
        role: state
        mandatory: true
        description: >
          Operációs állapot (RFC 8343 ifOperStatus).
          Adapter normalizálja a platform-specifikus értékeket.
        contract:
          - type: enum
            expression: [up, down, testing, unknown, dormant, not_present, lower_layer_down]

      - name: phys_address
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: string
        role: state
        optional: true
        description: MAC cím

      - name: speed_actual
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: integer
        role: operational
        optional: true
        capability: physical
        description: Tényleges tárgyalt sebesség (Mbps)

      - name: assigned_addresses
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: collection
        collection_variant: list
        role: state
        optional: true
        description: Ténylegesen kiosztott IP cím(ek) — statikus + DHCP-s
        item_fields:
          - name: address
            shape_type: scalar
            scalar_type: string
            role: key
          - name: origin
            shape_type: scalar
            scalar_type: string
            contract:
              - type: enum
                expression: [static, dhcp, dhcpv6, slaac, link_local, other]

      - name: statistics
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: object
        role: operational
        optional: true
        capability: statistics
        description: Forgalmi számlálók
        properties:
          - name: in_pkts
            shape_type: scalar
            scalar_type: integer
          - name: in_octets
            shape_type: scalar
            scalar_type: integer
          - name: in_errors
            shape_type: scalar
            scalar_type: integer
          - name: out_pkts
            shape_type: scalar
            scalar_type: integer
          - name: out_octets
            shape_type: scalar
            scalar_type: integer
          - name: out_errors
            shape_type: scalar
            scalar_type: integer

      # capability: stp
      - name: stp_state
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: object
        role: state
        optional: true
        capability: stp
        description: STP port állapot
        properties:
          - name: port_state
            shape_type: scalar
            scalar_type: string
            contract:
              - type: enum
                expression: [discarding, learning, forwarding, disabled]
          - name: port_role
            shape_type: scalar
            scalar_type: string
            contract:
              - type: enum
                expression: [root, designated, alternate, backup, disabled]
          - name: designated_root
            shape_type: scalar
            scalar_type: string
            description: Root bridge MAC cím
          - name: root_path_cost
            shape_type: scalar
            scalar_type: integer

      # capability: poe
      - name: poe_state
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: object
        role: state
        optional: true
        capability: poe
        description: PoE aktuális állapot
        properties:
          - name: status
            shape_type: scalar
            scalar_type: string
            contract:
              - type: enum
                expression: [delivering, searching, fault, disabled, test, other_fault]
          - name: power_mw
            shape_type: scalar
            scalar_type: integer
            description: Aktuálisan kiosztott teljesítmény milliwattban
          - name: poe_class
            shape_type: scalar
            scalar_type: integer
            description: IEEE 802.3 PoE osztály (0-8)

      # capability: lldp
      - name: lldp_neighbors
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: collection
        collection_variant: list
        role: state
        optional: true
        capability: lldp
        description: Felfedezett LLDP szomszédok (RFC 8516)
        item_fields:
          - name: chassis_id
            shape_type: scalar
            scalar_type: string
            role: key
          - name: port_id
            shape_type: scalar
            scalar_type: string
          - name: system_name
            shape_type: scalar
            scalar_type: string
            optional: true
          - name: system_description
            shape_type: scalar
            scalar_type: string
            optional: true
          - name: port_description
            shape_type: scalar
            scalar_type: string
            optional: true
          - name: capabilities
            shape_type: collection
            collection_variant: list
            optional: true
          - name: ttl_seconds
            shape_type: scalar
            scalar_type: integer
          - name: management_addresses
            shape_type: collection
            collection_variant: list
            optional: true

      # capability: lacp
      - name: lacp_state
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: object
        role: state
        optional: true
        capability: lacp
        description: LACP aggregáció aktuális állapota
        properties:
          - name: active_links
            shape_type: scalar
            scalar_type: integer
            description: Aktív taginterfészek száma
          - name: standby_links
            shape_type: scalar
            scalar_type: integer
            description: Standby taginterfészek száma
          - name: aggregation_id
            shape_type: scalar
            scalar_type: string
            description: LACP aggregáció azonosítója

  # ── OperationSurface ──────────────────────────────────────────────────────────
  operation_surface:
    aggregate_ref: "cic:core:OperationSurface@v0.2.0"
    operations:

      - name: enable
        atomic_ref: "cic:core:Behavior@v0.2.0"
        type: action
        idempotent: true
        description: Interfész adminisztrációs engedélyezése
        input: null
        output:
          - name: oper_status
            shape_type: scalar
            scalar_type: string

      - name: disable
        atomic_ref: "cic:core:Behavior@v0.2.0"
        type: action
        idempotent: true
        description: Interfész adminisztrációs tiltása
        input: null
        output:
          - name: oper_status
            shape_type: scalar
            scalar_type: string

      - name: flush_mac_table
        atomic_ref: "cic:core:Behavior@v0.2.0"
        type: action
        idempotent: false
        capability: vlan
        description: MAC cím tábla ürítése (switch VLAN-on)
        input: null
        output: null

  # ── NotificationSurface ───────────────────────────────────────────────────────
  notification_surface:
    events:
      - name: link-state-changed
        atomic_ref: "cic:core:Event@v0.2.0"
        trigger: state_change
        severity: info
        description: Interfész oper_status megváltozott (RFC 8343 linkUp/linkDown)
        payload:
          - name: previous_status
            shape_type: scalar
            scalar_type: string
          - name: current_status
            shape_type: scalar
            scalar_type: string

      - name: address-changed
        atomic_ref: "cic:core:Event@v0.2.0"
        trigger: state_change
        severity: info
        description: IP cím kiosztva vagy visszavonva
        payload:
          - name: address
            shape_type: scalar
            scalar_type: string
          - name: origin
            shape_type: scalar
            scalar_type: string
          - name: action
            shape_type: scalar
            scalar_type: string
            contract:
              - type: enum
                expression: [assigned, released]

      - name: error-threshold-exceeded
        atomic_ref: "cic:core:Event@v0.2.0"
        trigger: threshold
        severity: warning
        capability: statistics
        description: Hibaszámláló küszöböt átlépett
        payload:
          - name: counter
            shape_type: scalar
            scalar_type: string
          - name: value
            shape_type: scalar
            scalar_type: integer

  # ── BindingSurface ────────────────────────────────────────────────────────────
  binding_surface:
    addresses:
      - atomic_ref: "cic:core:Address@v0.2.0"
        schema_path: "/cic-network:interfaces/interface={backend}, {provider}, {location}, {id}"
        api_path: "/restconf/data/cic-network:interfaces/interface={backend}, {provider}, {location}, {id}"
        logical_id: "cic:network:{backend}:{provider}:{location}:{id}"
        namespace: "cic:network"
        key_fields:
          - name: backend
            type: enum
            values: [switch, ovs]
            description: >
              switch: fizikai managed switch (NETCONF/RESTCONF)
              ovs: OVS / Linux bridge (OVS-VSCTL/OVSDB)
          - name: provider
            type: string
            description: >
              switch: switch azonosítója (pl. juniper-01, cisco-core)
              ovs: hypervisor/host azonosítója (pl. proxmox-01, ovs-host-a)
          - name: location
            type: string
            description: Rack / panel / "-" ha a provider kezeli
          - name: id
            type: string
            description: >
              switch: interface neve (pl. ge-0/0/1, Gi1/0/1)
              ovs: bridge/port neve (pl. ovs-br0, vmbr0, tap100)
    adapter_capabilities:
      known_adapters:
        - name: switch-netconf-adapter
          backend: switch
          yang_blocks: [ietf-interfaces-physical, ietf-interfaces-l2vlan, cic-switchport-vlan]
          capabilities: [physical, vlan, statistics]
        - name: ovs-adapter
          backend: ovs
          yang_blocks: [ietf-interfaces-logical, ietf-interfaces-tunnel, ietf-ip-v4, ietf-ip-v6]
          capabilities: [logical, vlan, statistics]

# ── Levezetési lánc ───────────────────────────────────────────────────────────
derivation_chain:

  yang:
    status: specification-only
    module: cic-network
    namespace: "urn:cic:network"
    base_module: ietf-interfaces
    note: >
      A cic-network:interface lista az ietf-interfaces:interface lista CIC adaptációja.
      A yang_refs mezők jelzik melyik cic-yang building blockból származnak a mezők.

  restconf:
    collection: "GET /restconf/data/cic-network:interfaces"
    instance: "GET /restconf/data/cic-network:interfaces/interface={backend}, {provider}, {location}, {id}"
    config:
      read: "GET   /restconf/data/cic-network:interfaces/interface={backend}, {provider}, {location}, {id}/config"
      update: "PUT   /restconf/data/cic-network:interfaces/interface={backend}, {provider}, {location}, {id}/config"
      patch: "PATCH /restconf/data/cic-network:interfaces/interface={backend}, {provider}, {location}, {id}/config"
    state:
      read: "GET   /restconf/data/cic-network:interfaces/interface={backend}, {provider}, {location}, {id}/state"
    operations:
      enable: "POST /restconf/operations/cic-network:interfaces/interface={backend}, {provider}, {location}, {id}/enable"
      disable: "POST /restconf/operations/cic-network:interfaces/interface={backend}, {provider}, {location}, {id}/disable"
      flush_mac_table: "POST /restconf/operations/cic-network:interfaces/interface={backend}, {provider}, {location}, {id}/flush-mac-table"
    events:
      stream: "GET /restconf/streams/cic-network-events"

  runtime:
    reconcile_loop: |
      1. observe:  adapter.get(backend, provider, location, id) → state_surface
      2. compare:  diff(config_surface, state_surface) → drift?
      3. if drift:
           enabled mismatch → enable/disable
           vlan config changed → adapter reconfigures VLAN membership
           ip changed → adapter updates address config (static) vagy dhcp flag
      4. emit: link-state-changed, address-changed events
