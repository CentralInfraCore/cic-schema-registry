# WORKING COPY — not a versioned, signed release file (no -src<year>
# suffix, so tools/registrylib's filename pattern and all registry
# tooling ignore this file entirely: make check/registry_validate/
# generate_latest/signing never see it).
#
# This is the editable source of truth: the latest release
# (network-interface.v0.4.3-src2026.yaml) is frozen and signed, so it can
# never be edited in place (tools/generate_latest.py
# check_no_frozen_edits). Changes happen HERE first; when ready, a new
# network-interface.vX.Y.Z-src<year>.yaml is cut FROM this file's current
# content and signed (cic-schema-registry#125).
#
# Diff vs. network-interface.v0.4.3-src2026.yaml: every atomic_ref/
# aggregate_ref/ref: schemas/{atomic,aggregate}/*.yaml replaced with
# the already-working cic:core:<Name>@v0.2.0 pin format (see #125) --
# no other content changed.
---
metadata:
  name: NetworkInterface
  version: v1.0.0
  description: >
    Egységes hálózati interfész erőforrás — fizikai switch port, logikai interfész
    (OVS bridge, loopback), VLAN szegmens és tunnel (VXLAN/GRE) egyaránt leírható.
    RFC 8343 (ietf-interfaces) alapú, cic-yang building blockok felhasználásával.

    Scope: L2 switching és overlay hálózat. Service réteg (routing protokollok,
    NAT, DHCP szerver, cloud VPC) — NEM ide tartozik.

    A type mező (RFC 8343 ifType alapján) határozza meg a konkrét interfész kategóriát.
    A platform különbség (fizikai switch vs OVS vs Linux bridge) az adapter rétegben van.

    v0.4.2: ietf-interfaces-vlan lecserélve a #47 szerint szétválasztott
    ietf-interfaces-l2vlan + cic-switchport-vlan blokk-párra, mind a
    yang_refs listában, mind a switch-netconf-adapter yang_blocks
    referenciájában — összhangban a switch-netconf-adapter.v0.4.2/
    ovs-adapter.v0.4.2 migrációval.

    v0.4.3: state_surface.source és binding_surface.adapter placeholder
    mezői (network-adapter — nem létező adapter-név) törölve, ugyanaz a
    minta, mint #27 a compute-resource-nál. A valós útválasztás
    binding_surface.adapter_capabilities.known_adapters-en megy
    (switch-netconf-adapter, ovs-adapter). Lásd #98.

    v0.4.5: binding_surface.addresses[].key_fields migrálva a
    formalizált Shape+Role primitívekre — lásd cic-primitives#5 és
    proposals/atom-grammar/README.md §2.7. MINOR bump, nem coverage-
    mutáció.
    v1.0.0 (#143): stp/poe/storm_control/qinq/lacp/lldp/port_mirror/
    statistics/stp_state/poe_state/lacp_state `shape_type: object` →
    `composite` + `properties:` → `fields:` (az `object` nincs a kernel
    zárt típuskészletében). logical_interfaces[].ip/nameservers
    ugyanígy, +sima cím-listák (ip.addresses, nameservers.addresses/
    search, lldp_neighbors[].capabilities/management_addresses)
    `collection_variant: set` + `item_scalar_type`-ra. vxlans[].ip
    (sosem lett kibontva) `shape_type: opaque`-ra, tartalom nélkül.
    vlans: `vlan_id` most `role: key, mandatory: true` (a lista
    kulcsa, `ref`-es elemnél is kötelező), `allowed_vlans`
    `set`+`item_scalar_type: integer`-re. vxlans: `vni` ugyanígy a
    lista kulcsa. logical_interfaces: új `name` mező szintetikus lista-
    kulcsként, mert sem `ref`, sem a `logical_type`+`vlan_ref` pár nem
    mindig jelen lévő azonosító. MAJOR bump: valódi shape-mutáció.

    v1.0.0 finomítás (még ugyanez a MAJOR lépés, mielőtt release-be
    kerülne — a v1.0.0 még sosem lett `-src<év>` kiadásként kivágva):
    vlans/vxlans `item_fields` → `item_choice`-ra (cic-primitives#8,
    PR #9, lásd thead13.txt). A fenti `vlan_id`/`vni` mindkét ág alatti
    kötelezővé tétele megoldotta a C8-at, de emellett egy redundáns
    identitás-állítást vezetett be (`dereference(ref).vlan_id ==
    vlan_id`, semmi nem garantálta) — ezt jelezte a #146 review, rögzítve
    thead10.txt-ben. Az `item_choice` ezt megszünteti: a `referenced`
    case-nek csak `ref`, az `inline` case-nek csak `vlan_id`/`vni` (+
    egyéb inline mezők) a mezője, a két mező sosem szerepel egyazon
    elemen. `logical_interfaces` SZÁNDÉKOSAN VÁLTOZATLAN marad — ott a
    kulcs (`name`) egységes, nem case-enként eltérő, tehát nincs
    item_choice-ra alkalmazható diszkriminált unió, csak opcionális
    mezőkombináció egy közös kulcs mellett (lásd a mező saját
    description-jét).
  owner: Gabor Zoltan Sinko
  tags:
    - domain-composition
    - network
    - rfc8343
  validatedBy:
    name: cic-primitives
    version: v0.2.0

spec:
  kind: DomainComposition
  base:
    aggregate: ManagedEntity
    ref: "cic:core:ManagedEntity@v0.2.0"

  yang_refs:
    - block: ietf-interfaces-base
      source: cic-yang@v0.1.3
    - block: ietf-interfaces-physical
      source: cic-yang@v0.1.3
    - block: ietf-interfaces-logical
      source: cic-yang@v0.1.3
    - block: ietf-interfaces-l2vlan
      source: cic-schema-registry
    - block: cic-switchport-vlan
      source: cic-schema-registry
    - block: ietf-interfaces-tunnel
      source: cic-yang@v0.1.3
    - block: ietf-ip-v4
      source: cic-yang@v0.1.3
    - block: ietf-ip-v6
      source: cic-yang@v0.1.3
    - block: ietf-lldp
      source: cic-yang@v0.1.3

  # ── PolicySurface ─────────────────────────────────────────────────────────────
  policy_surface:
    default_access: open
    default_modify: owner
    surface_rules:
      - surface: state_surface
        modify: [OU=adapters, O=cic]
      - surface: config_surface
        access: [O=owner]
        modify: [O=owner]
    inherit_policy: true

  # ── Identity ─────────────────────────────────────────────────────────────────
  identity:
    atomic_ref: "cic:core:Identity@v0.2.0"
    kind: NetworkInterface
    namespace: "cic:network"
    version: v0.3.dev
    base: "cic:core:ManagedEntity@v0.2.0"
    abstract: false
    description: RFC 8343 alapú hálózati interfész erőforrás

  # ── ConfigSurface ─────────────────────────────────────────────────────────────
  config_surface:
    aggregate_ref: "cic:core:ConfigSurface@v0.2.0"
    yang_source: ietf-interfaces-base (cic-yang@v0.1.3)
    nodes:

      # ── Core (ietf-interfaces-base) ──────────────────────────────────────────
      - name: type
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: string
        role: config
        mandatory: true
        description: >
          RFC 8343 ifType alapú interfész kategória.
          physical: Ethernet port, LAG/bond (ethernetCsmacd, ieee8023adLag)
          logical: bridge, loopback, SVI (softwareLoopback, bridge, other)
          vlan: L2 VLAN szegmens (l2vlan) — mindig szülőhöz kötött
          tunnel: VXLAN, GRE, IPIP encapsulation
          bond: port-channel, LACP aggregáció (ieee8023adLag)
          loopback: loopback interfész (softwareLoopback)
        contract:
          - type: enum
            expression: [physical, logical, vlan, tunnel, bond, loopback]

      - name: description
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: string
        role: config
        optional: true
        description: Emberi olvasható leírás

      - name: enabled
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: boolean
        role: config
        optional: true
        default: true
        description: Adminisztrációs állapot

      - name: mtu
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: integer
        role: config
        optional: true
        default: 1500
        contract:
          - type: range
            expression: "68..9216"

      # ── Physical-specifikus (ietf-interfaces-physical) ────────────────────────
      - name: speed
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: integer
        role: config
        optional: true
        capability: physical
        description: Konfigurált port sebesség (Mbps) — null = auto-negotiate

      - name: duplex
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: string
        role: config
        optional: true
        default: auto
        capability: physical
        contract:
          - type: enum
            expression: [full, half, auto]

      # ── Typed sub-collections ─────────────────────────────────────────────────

      - name: vlans
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: collection
        collection_variant: list
        role: config
        optional: true
        description: >
          VLAN szegmensek ezen az interfészen (ietf-interfaces-vlan alapján).
          Minden elem VAGY egy megosztott VLAN-definícióra mutató ref, VAGY
          egy inline definíció — a kettő alternatíva, nem együtt kötelező.
          applicable_when: type in [physical, logical, bond]

          cic-primitives#8/item_choice (a #143-as C8-fix utólagos
          pontosítása, lásd thead10.txt + thead13.txt): korábban ez a mező
          `item_fields`-et használt, `vlan_id`-t `role: key, mandatory: true`
          téve — ami C8-kompatibilis volt, de emellett megkövetelte, hogy
          `vlan_id` `ref` esetén is jelen legyen, egy redundáns identitás-
          állítást bevezetve (`dereference(ref).vlan_id == vlan_id`, semmi
          nem garantálta). Az `item_choice` (cic-primitives PR #9) ezt
          megszünteti: a `referenced` case-nek CSAK `ref` a mezője, az
          `inline` case-nek CSAK `vlan_id` (+ a többi inline mező) — a két
          mező sosem szerepel egyazon elemen.
        item_choice:
          cases:
            - name: referenced
              key: [ref]
              fields:
                - name: ref
                  shape_type: scalar
                  scalar_type: string
                  role: key
                  mandatory: true
                  description: CIC address pointer megosztott VLAN-definícióra
            - name: inline
              key: [vlan_id]
              fields:
                - name: vlan_id
                  shape_type: scalar
                  scalar_type: integer
                  role: key
                  mandatory: true
                  description: VLAN azonosító (1-4094) — ennek a variánsnak a kulcsa
                - name: vlan_mode
                  shape_type: scalar
                  scalar_type: string
                  optional: true
                  default: access
                  contract:
                    - type: enum
                      expression: [access, trunk, hybrid]
                - name: allowed_vlans
                  shape_type: collection
                  collection_variant: set
                  item_scalar_type: integer
                  optional: true
                  description: Engedélyezett VLAN ID-k trunk módban
                - name: dhcp_service
                  shape_type: scalar
                  scalar_type: string
                  optional: true
                  description: DHCP service CIC address referencia (service réteg)

      - name: logical_interfaces
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: collection
        collection_variant: list
        role: config
        optional: true
        description: >
          Logikai subinterfészek / SVI-k (ietf-interfaces-logical + ietf-ip-v4/v6 alapján).
          Minden elem: ref VAGY inline logikai interfész definíció + opcionális IP konfig.
          applicable_when: type in [physical, logical, bond]
          A `name` mező (#143, C8) szintetikus lista-kulcs — sem `ref`, sem
          a `logical_type`+`vlan_ref` pár nem mindig jelen lévő, egyedi
          azonosító, ugyanaz a minta, mint compute-resource
          network_interfaces/node_pools saját `name` kulcsa.

          SZÁNDÉKOSAN NEM migrálva `item_choice`-ra (cic-primitives#8,
          lásd thead13.txt), a `vlans`/`vxlans`-tól eltérően: itt a kulcs
          (`name`) EGYSÉGES marad minden elemen, nem case-enként eltérő —
          csak a NEM-kulcs mezők (`ref` vs. `logical_type`+`vlan_ref`)
          opcionálisak. Ha mindkét case-nek `key: [name]` lenne, azt a
          cic-primitives#9 C17 szabálya (két case nem oldódhat fel
          ugyanarra a kulcsra) most már el is utasítaná — helyesen, mert
          itt nincs is valódi diszkriminált unió, csak egy egységes kulcs
          melletti opcionális mezőkombináció. Nincs is redundáns identitás-
          állítás itt (a `name` nem ismétel meg semmit, amit `ref` már
          hordoz), tehát nincs mit megszüntetni.
        item_fields:
          - name: name
            shape_type: scalar
            scalar_type: string
            role: key
            mandatory: true
            description: Logikai subinterfész neve (pl. eth0.100, vlan100)
          - name: ref
            shape_type: scalar
            scalar_type: string
            optional: true
            description: CIC address pointer megosztott logikai interfészre
          - name: logical_type
            shape_type: scalar
            scalar_type: string
            optional: true
            contract:
              - type: enum
                expression: [subinterface, svi, other]
          - name: vlan_ref
            shape_type: scalar
            scalar_type: integer
            optional: true
            description: VLAN ID amire ez a logikai interfész épül
          - name: ip
            shape_type: composite
            optional: true
            description: IP konfiguráció (ietf-ip-v4/v6 alapján, netplan-kompatibilis)
            fields:
              - name: addresses
                shape_type: collection
                collection_variant: set
                item_scalar_type: string
                optional: true
                description: Statikus IP cím(ek) CIDR formátumban (IPv4 és/vagy IPv6)
              - name: gateway4
                shape_type: scalar
                scalar_type: string
                optional: true
                description: Default IPv4 gateway
              - name: gateway6
                shape_type: scalar
                scalar_type: string
                optional: true
                description: Default IPv6 gateway
              - name: nameservers
                shape_type: composite
                optional: true
                fields:
                  - name: addresses
                    shape_type: collection
                    collection_variant: set
                    item_scalar_type: string
                    optional: true
                  - name: search
                    shape_type: collection
                    collection_variant: set
                    item_scalar_type: string
                    optional: true
              - name: routes
                shape_type: collection
                collection_variant: list
                optional: true
                description: Statikus route-ok
                item_fields:
                  - name: to
                    shape_type: scalar
                    scalar_type: string
                    role: key
                  - name: via
                    shape_type: scalar
                    scalar_type: string
                    optional: true
                  - name: metric
                    shape_type: scalar
                    scalar_type: integer
                    optional: true
                    default: 100
              - name: dhcp4
                shape_type: scalar
                scalar_type: boolean
                optional: true
                default: false
              - name: dhcp6
                shape_type: scalar
                scalar_type: boolean
                optional: true
                default: false
              - name: accept_ra
                shape_type: scalar
                scalar_type: boolean
                optional: true
                default: true

      - name: vxlans
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: collection
        collection_variant: list
        role: config
        optional: true
        description: >
          VXLAN tunnel interfészek (ietf-interfaces-tunnel alapján).
          applicable_when: type in [logical, bridge]
          Minden elem VAGY ref, VAGY inline definíció — ua. item_choice
          minta, mint a vlans-nál (lásd ott a #8/item_choice/thead13
          jegyzetet a korábbi redundáns ref+vni állítás megszüntetéséről).
        item_choice:
          cases:
            - name: referenced
              key: [ref]
              fields:
                - name: ref
                  shape_type: scalar
                  scalar_type: string
                  role: key
                  mandatory: true
                  description: CIC address pointer megosztott tunnel definícióra
            - name: inline
              key: [vni]
              fields:
                - name: vni
                  shape_type: scalar
                  scalar_type: integer
                  role: key
                  mandatory: true
                  description: VXLAN Network Identifier (1-16777215) — ennek a variánsnak a kulcsa
                - name: local_endpoint
                  shape_type: scalar
                  scalar_type: string
                  optional: true
                  description: Helyi tunnel végpont IP cím (IPv4 vagy IPv6)
                - name: remote_endpoint
                  shape_type: scalar
                  scalar_type: string
                  optional: true
                  description: Távoli tunnel végpont — point-to-point vagy multicast
                - name: learning
                  shape_type: scalar
                  scalar_type: boolean
                  optional: true
                  default: true
                  description: MAC learning — false = BGP EVPN vezérelt
                - name: ip
                  shape_type: opaque
                  optional: true
                  description: >
                    IP konfiguráció a tunnel interfészen (netplan-kompatibilis) —
                    a logikai interfészek `ip` mezőjével azonos fogalom, de
                    itt sosem lett kibontva `fields`-ként; `opaque` jelöli,
                    hogy a séma szándékosan nem néz bele, nem hazudja
                    üresnek. Kibontása külön feladat.

      # ── STP / Spanning Tree (capability: stp) ────────────────────────────────
      - name: stp
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: composite
        role: config
        optional: true
        capability: stp
        description: Spanning Tree Protocol konfiguráció (IEEE 802.1D/Q/w/s)
        fields:
          - name: enabled
            shape_type: scalar
            scalar_type: boolean
            default: true
          - name: mode
            shape_type: scalar
            scalar_type: string
            contract:
              - type: enum
                expression: [stp, rstp, mstp]
            default: rstp
          - name: port_priority
            shape_type: scalar
            scalar_type: integer
            default: 128
            description: STP port prioritás (0-240, 16-os lépésekben)
          - name: path_cost
            shape_type: scalar
            scalar_type: integer
            optional: true
            description: STP path cost (null = auto, sebességből számított)
          - name: edge_port
            shape_type: scalar
            scalar_type: boolean
            default: false
            description: Edge port / PortFast — uplink nélküli végpont portok
          - name: bpdu_guard
            shape_type: scalar
            scalar_type: boolean
            default: false
            description: BPDU Guard — edge porton BPDU érkezésekor port shutdown
          - name: bpdu_filter
            shape_type: scalar
            scalar_type: boolean
            default: false
            description: BPDU Filter — BPDU küldés/fogadás tiltása
          - name: root_guard
            shape_type: scalar
            scalar_type: boolean
            default: false
            description: Root Guard — megakadályozza hogy ez a port root legyen

      # ── PoE (capability: poe) ─────────────────────────────────────────────────
      - name: poe
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: composite
        role: config
        optional: true
        capability: poe
        description: Power over Ethernet konfiguráció (IEEE 802.3at/bt)
        fields:
          - name: enabled
            shape_type: scalar
            scalar_type: boolean
            default: true
          - name: mode
            shape_type: scalar
            scalar_type: string
            contract:
              - type: enum
                expression: [auto, static, never]
            default: auto
            description: auto=eszköz igénye alapján, static=fix osztás, never=tiltott
          - name: priority
            shape_type: scalar
            scalar_type: string
            contract:
              - type: enum
                expression: [low, high, critical]
            default: low
            description: PoE prioritás — teljesítmény túllépésnél alacsony prioritású portok zárnak le
          - name: power_limit_mw
            shape_type: scalar
            scalar_type: integer
            optional: true
            description: Maximum kiosztott teljesítmény milliwattban (null = automatikus)

      # ── Storm control (capability: storm_control) ─────────────────────────────
      - name: storm_control
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: composite
        role: config
        optional: true
        capability: storm_control
        description: Broadcast/multicast flood korlát
        fields:
          - name: broadcast_threshold_pct
            shape_type: scalar
            scalar_type: integer
            optional: true
            description: Broadcast forgalom maximum sávszélesség %-ban (1-100)
          - name: multicast_threshold_pct
            shape_type: scalar
            scalar_type: integer
            optional: true
            description: Multicast forgalom maximum sávszélesség %-ban
          - name: unknown_unicast_threshold_pct
            shape_type: scalar
            scalar_type: integer
            optional: true
            description: Unknown unicast maximum sávszélesség %-ban
          - name: action
            shape_type: scalar
            scalar_type: string
            contract:
              - type: enum
                expression: [drop, shutdown]
            default: drop
            description: Küszöb átlépésekor — drop=forgalom eldobás, shutdown=port leállítás

      # ── QinQ / 802.1ad (capability: qinq) ────────────────────────────────────
      - name: qinq
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: composite
        role: config
        optional: true
        capability: qinq
        description: "QinQ double tagging konfiguráció (IEEE 802.1ad)"
        fields:
          - name: enabled
            shape_type: scalar
            scalar_type: boolean
            default: false
          - name: outer_vlan_id
            shape_type: scalar
            scalar_type: integer
            optional: true
            description: Külső VLAN tag (service VLAN / S-VLAN, 1-4094)
          - name: inner_vlan_id
            shape_type: scalar
            scalar_type: integer
            optional: true
            description: Belső VLAN tag (customer VLAN / C-VLAN, 1-4094)
          - name: tpid
            shape_type: scalar
            scalar_type: string
            default: "0x88a8"
            description: "Külső tag TPID — 0x88a8 (IEEE 802.1ad) vagy 0x8100 (legacy)"

      # ── LACP részletek (capability: lacp) ────────────────────────────────────
      - name: lacp
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: composite
        role: config
        optional: true
        capability: lacp
        description: LACP (Link Aggregation Control Protocol) részletes konfiguráció
        fields:
          - name: interval
            shape_type: scalar
            scalar_type: string
            contract:
              - type: enum
                expression: [fast, slow]
            default: slow
            description: "LACP PDU küldési intervallum — fast: 1s, slow: 30s"
          - name: system_priority
            shape_type: scalar
            scalar_type: integer
            default: 32768
            description: LACP rendszer prioritás (1-65535, kisebb = magasabb prioritás)
          - name: port_priority
            shape_type: scalar
            scalar_type: integer
            default: 32768
            description: LACP port prioritás (1-65535)
          - name: min_links
            shape_type: scalar
            scalar_type: integer
            default: 1
            description: Minimális aktív taginterfészek száma — alatta a LAG leáll
          - name: max_links
            shape_type: scalar
            scalar_type: integer
            optional: true
            description: Maximum aktív taginterfészek száma (null = korlátlan)

      # ── LLDP (capability: lldp) ───────────────────────────────────────────────
      - name: lldp
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: composite
        role: config
        optional: true
        capability: lldp
        description: LLDP konfiguráció (RFC 8516, ietf-lldp cic-yang@v0.1.3)
        fields:
          - name: enabled
            shape_type: scalar
            scalar_type: boolean
            default: true
          - name: transmit
            shape_type: scalar
            scalar_type: boolean
            default: true
          - name: receive
            shape_type: scalar
            scalar_type: boolean
            default: true
          - name: tlvs
            shape_type: collection
            collection_variant: set
            item_scalar_type: string
            optional: true
            description: Hirdetett TLV-k (system-name, port-description, management-address stb.)

      # ── Port mirroring / SPAN (capability: port_mirror) ──────────────────────
      - name: port_mirror
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: composite
        role: config
        optional: true
        capability: port_mirror
        description: Port tükrözés / SPAN — forgalom másolása monitoring portra
        fields:
          - name: enabled
            shape_type: scalar
            scalar_type: boolean
            default: false
          - name: direction
            shape_type: scalar
            scalar_type: string
            contract:
              - type: enum
                expression: [rx, tx, both]
            default: both
            description: Tükrözött forgalom iránya
          - name: destination
            shape_type: scalar
            scalar_type: string
            description: Célport interface neve ahová a tükrözött forgalom megy

      # ── Szülő-gyerek reláció (RFC 8343 higher/lower-layer-if) ─────────────────
      - name: lower_layer_if
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: collection
        collection_variant: list
        role: config
        optional: true
        description: >
          Alsó réteg interfészek — OVS bridge esetén az uplink port,
          bond esetén a taginterfészek nevei.
        item_fields:
          - name: name
            shape_type: scalar
            scalar_type: string
            role: key

  # ── StateSurface ──────────────────────────────────────────────────────────────
  state_surface:
    aggregate_ref: "cic:core:StateSurface@v0.2.0"
    freshness:
      ttl: 30s
      strategy: event-driven
    nodes:

      - name: oper_status
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: string
        role: state
        mandatory: true
        description: >
          Operációs állapot (RFC 8343 ifOperStatus).
          Adapter normalizálja a platform-specifikus értékeket.
        contract:
          - type: enum
            expression: [up, down, testing, unknown, dormant, not_present, lower_layer_down]

      - name: phys_address
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: string
        role: state
        optional: true
        description: MAC cím

      - name: speed_actual
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: integer
        role: operational
        optional: true
        capability: physical
        description: Tényleges tárgyalt sebesség (Mbps)

      - name: assigned_addresses
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: collection
        collection_variant: list
        role: state
        optional: true
        description: Ténylegesen kiosztott IP cím(ek) — statikus + DHCP-s
        item_fields:
          - name: address
            shape_type: scalar
            scalar_type: string
            role: key
          - name: origin
            shape_type: scalar
            scalar_type: string
            contract:
              - type: enum
                expression: [static, dhcp, dhcpv6, slaac, link_local, other]

      - name: statistics
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: composite
        role: operational
        optional: true
        capability: statistics
        description: Forgalmi számlálók
        fields:
          - name: in_pkts
            shape_type: scalar
            scalar_type: integer
          - name: in_octets
            shape_type: scalar
            scalar_type: integer
          - name: in_errors
            shape_type: scalar
            scalar_type: integer
          - name: out_pkts
            shape_type: scalar
            scalar_type: integer
          - name: out_octets
            shape_type: scalar
            scalar_type: integer
          - name: out_errors
            shape_type: scalar
            scalar_type: integer

      # capability: stp
      - name: stp_state
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: composite
        role: state
        optional: true
        capability: stp
        description: STP port állapot
        fields:
          - name: port_state
            shape_type: scalar
            scalar_type: string
            contract:
              - type: enum
                expression: [discarding, learning, forwarding, disabled]
          - name: port_role
            shape_type: scalar
            scalar_type: string
            contract:
              - type: enum
                expression: [root, designated, alternate, backup, disabled]
          - name: designated_root
            shape_type: scalar
            scalar_type: string
            description: Root bridge MAC cím
          - name: root_path_cost
            shape_type: scalar
            scalar_type: integer

      # capability: poe
      - name: poe_state
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: composite
        role: state
        optional: true
        capability: poe
        description: PoE aktuális állapot
        fields:
          - name: status
            shape_type: scalar
            scalar_type: string
            contract:
              - type: enum
                expression: [delivering, searching, fault, disabled, test, other_fault]
          - name: power_mw
            shape_type: scalar
            scalar_type: integer
            description: Aktuálisan kiosztott teljesítmény milliwattban
          - name: poe_class
            shape_type: scalar
            scalar_type: integer
            description: IEEE 802.3 PoE osztály (0-8)

      # capability: lldp
      - name: lldp_neighbors
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: collection
        collection_variant: list
        role: state
        optional: true
        capability: lldp
        description: Felfedezett LLDP szomszédok (RFC 8516)
        item_fields:
          - name: chassis_id
            shape_type: scalar
            scalar_type: string
            role: key
          - name: port_id
            shape_type: scalar
            scalar_type: string
          - name: system_name
            shape_type: scalar
            scalar_type: string
            optional: true
          - name: system_description
            shape_type: scalar
            scalar_type: string
            optional: true
          - name: port_description
            shape_type: scalar
            scalar_type: string
            optional: true
          - name: capabilities
            shape_type: collection
            collection_variant: set
            item_scalar_type: string
            optional: true
          - name: ttl_seconds
            shape_type: scalar
            scalar_type: integer
          - name: management_addresses
            shape_type: collection
            collection_variant: set
            item_scalar_type: string
            optional: true

      # capability: lacp
      - name: lacp_state
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: composite
        role: state
        optional: true
        capability: lacp
        description: LACP aggregáció aktuális állapota
        fields:
          - name: active_links
            shape_type: scalar
            scalar_type: integer
            description: Aktív taginterfészek száma
          - name: standby_links
            shape_type: scalar
            scalar_type: integer
            description: Standby taginterfészek száma
          - name: aggregation_id
            shape_type: scalar
            scalar_type: string
            description: LACP aggregáció azonosítója

  # ── OperationSurface ──────────────────────────────────────────────────────────
  operation_surface:
    aggregate_ref: "cic:core:OperationSurface@v0.2.0"
    operations:

      - name: enable
        atomic_ref: "cic:core:Behavior@v0.2.0"
        type: action
        idempotent: true
        description: Interfész adminisztrációs engedélyezése
        input: null
        output:
          - name: oper_status
            shape_type: scalar
            scalar_type: string

      - name: disable
        atomic_ref: "cic:core:Behavior@v0.2.0"
        type: action
        idempotent: true
        description: Interfész adminisztrációs tiltása
        input: null
        output:
          - name: oper_status
            shape_type: scalar
            scalar_type: string

      - name: flush_mac_table
        atomic_ref: "cic:core:Behavior@v0.2.0"
        type: action
        idempotent: false
        capability: vlan
        description: MAC cím tábla ürítése (switch VLAN-on)
        input: null
        output: null

  # ── NotificationSurface ───────────────────────────────────────────────────────
  notification_surface:
    events:
      - name: link-state-changed
        atomic_ref: "cic:core:Event@v0.2.0"
        trigger: state_change
        severity: info
        description: Interfész oper_status megváltozott (RFC 8343 linkUp/linkDown)
        payload:
          - name: previous_status
            shape_type: scalar
            scalar_type: string
          - name: current_status
            shape_type: scalar
            scalar_type: string

      - name: address-changed
        atomic_ref: "cic:core:Event@v0.2.0"
        trigger: state_change
        severity: info
        description: IP cím kiosztva vagy visszavonva
        payload:
          - name: address
            shape_type: scalar
            scalar_type: string
          - name: origin
            shape_type: scalar
            scalar_type: string
          - name: action
            shape_type: scalar
            scalar_type: string
            contract:
              - type: enum
                expression: [assigned, released]

      - name: error-threshold-exceeded
        atomic_ref: "cic:core:Event@v0.2.0"
        trigger: threshold
        severity: warning
        capability: statistics
        description: Hibaszámláló küszöböt átlépett
        payload:
          - name: counter
            shape_type: scalar
            scalar_type: string
          - name: value
            shape_type: scalar
            scalar_type: integer

  # ── BindingSurface ────────────────────────────────────────────────────────────
  binding_surface:
    addresses:
      - atomic_ref: "cic:core:Address@v0.2.0"
        schema_path: "/cic-network:interfaces/interface={backend}, {provider}, {location}, {id}"
        api_path: "/restconf/data/cic-network:interfaces/interface={backend}, {provider}, {location}, {id}"
        logical_id: "cic:network:{backend}:{provider}:{location}:{id}"
        namespace: "cic:network"
        key_fields:
          - name: backend
            atomic_ref: "cic:core:Shape@v0.2.0"
            shape_type: scalar
            scalar_type: string
            role: key
            mandatory: true
            contract:
              - type: enum
                expression: [switch, ovs]
            description: >
              switch: fizikai managed switch (NETCONF/RESTCONF)
              ovs: OVS / Linux bridge (OVS-VSCTL/OVSDB)
          - name: provider
            atomic_ref: "cic:core:Shape@v0.2.0"
            shape_type: scalar
            scalar_type: string
            role: key
            mandatory: true
            description: >
              switch: switch azonosítója (pl. juniper-01, cisco-core)
              ovs: hypervisor/host azonosítója (pl. proxmox-01, ovs-host-a)
          - name: location
            atomic_ref: "cic:core:Shape@v0.2.0"
            shape_type: scalar
            scalar_type: string
            role: key
            mandatory: true
            description: Rack / panel / "-" ha a provider kezeli
          - name: id
            atomic_ref: "cic:core:Shape@v0.2.0"
            shape_type: scalar
            scalar_type: string
            role: key
            mandatory: true
            description: >
              switch: interface neve (pl. ge-0/0/1, Gi1/0/1)
              ovs: bridge/port neve (pl. ovs-br0, vmbr0, tap100)
    adapter_capabilities:
      known_adapters:
        - name: switch-netconf-adapter
          backend: switch
          yang_blocks: [ietf-interfaces-physical, ietf-interfaces-l2vlan, cic-switchport-vlan]
          capabilities: [physical, vlan, statistics]
        - name: ovs-adapter
          backend: ovs
          yang_blocks: [ietf-interfaces-logical, ietf-interfaces-tunnel, ietf-ip-v4, ietf-ip-v6]
          capabilities: [logical, vlan, statistics]

# ── Levezetési lánc ───────────────────────────────────────────────────────────
derivation_chain:

  yang:
    status: specification-only
    module: cic-network
    namespace: "urn:cic:network"
    base_module: ietf-interfaces
    note: >
      A cic-network:interface lista az ietf-interfaces:interface lista CIC adaptációja.
      A yang_refs mezők jelzik melyik cic-yang building blockból származnak a mezők.

  restconf:
    collection: "GET /restconf/data/cic-network:interfaces"
    instance: "GET /restconf/data/cic-network:interfaces/interface={backend}, {provider}, {location}, {id}"
    config:
      read: "GET   /restconf/data/cic-network:interfaces/interface={backend}, {provider}, {location}, {id}/config"
      update: "PUT   /restconf/data/cic-network:interfaces/interface={backend}, {provider}, {location}, {id}/config"
      patch: "PATCH /restconf/data/cic-network:interfaces/interface={backend}, {provider}, {location}, {id}/config"
    state:
      read: "GET   /restconf/data/cic-network:interfaces/interface={backend}, {provider}, {location}, {id}/state"
    operations:
      enable: "POST /restconf/operations/cic-network:interfaces/interface={backend}, {provider}, {location}, {id}/enable"
      disable: "POST /restconf/operations/cic-network:interfaces/interface={backend}, {provider}, {location}, {id}/disable"
      flush_mac_table: "POST /restconf/operations/cic-network:interfaces/interface={backend}, {provider}, {location}, {id}/flush-mac-table"
    events:
      stream: "GET /restconf/streams/cic-network-events"

  runtime:
    reconcile_loop: |
      1. observe:  adapter.get(backend, provider, location, id) → state_surface
      2. compare:  diff(config_surface, state_surface) → drift?
      3. if drift:
           enabled mismatch → enable/disable
           vlan config changed → adapter reconfigures VLAN membership
           ip changed → adapter updates address config (static) vagy dhcp flag
      4. emit: link-state-changed, address-changed events
