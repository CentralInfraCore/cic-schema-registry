# WORKING COPY — not a versioned, signed release file (no -src<year>
# suffix, so tools/registrylib's filename pattern and all registry
# tooling ignore this file entirely: make check/registry_validate/
# generate_latest/signing never see it).
#
# This is the editable source of truth: the latest release
# (dhcp-service.v0.1.0-src2026.yaml) is frozen and signed, so it can
# never be edited in place (tools/generate_latest.py
# check_no_frozen_edits). Changes happen HERE first; when ready, a new
# dhcp-service.vX.Y.Z-src<year>.yaml is cut FROM this file's current
# content and signed (cic-schema-registry#125).
#
# Diff vs. dhcp-service.v0.1.0-src2026.yaml: every atomic_ref/
# aggregate_ref/ref: schemas/{atomic,aggregate}/*.yaml replaced with
# the already-working cic:core:<Name>@v0.2.0 pin format (see #125) --
# no other content changed.
---
metadata:
  name: DHCPService
  version: v0.1.0
  description: >
    DHCP szolgáltatás — cím-pool, lease-kezelés, static reservation. Ez a
    hiányzó definíció ahhoz a `target_kind: DHCPService` referenciához,
    amit a standards/yang alatti VLAN/L2VLAN blokkok (`dhcp_service` mező)
    korábban lógó pointerként hordoztak — nyolc fájlban hivatkozott rá
    tartalom nélkül.

    Scope: adat-oldali leírás. Ez a séma azt írja le, MILYEN egy DHCP
    szolgáltatás (config/state/operations/notifications) — a tényleges
    végrehajtási réteg (isc-dhcp/kea/dnsmasq adapter kontraktus, mint a
    `../switch-netconf-adapter/`/`../ovs-adapter/` mintája) szándékosan
    később készül el, nem ennek a fájlnak a része.

    `NetworkInterface` saját maga explicit kizárja a DHCP szervert a
    scope-jából ("Service réteg... NEM ide tartozik") — ez a fájl az a
    service-réteg objektum, amire a kizárás mutat.
  owner: Gabor Zoltan Sinko
  tags:
    - domain-composition
    - network
    - dhcp
  validatedBy:
    name: cic-primitives
    version: v0.2.0

spec:
  kind: DomainComposition
  base:
    aggregate: ManagedEntity
    ref: "cic:core:ManagedEntity@v0.2.0"

  # ── PolicySurface ─────────────────────────────────────────────────────────────
  policy_surface:
    default_access: open
    default_modify: owner
    surface_rules:
      - surface: state_surface
        modify: [OU=adapters, O=cic]
      - surface: config_surface
        access: [O=owner]
        modify: [O=owner]
    inherit_policy: true

  # ── Identity ─────────────────────────────────────────────────────────────────
  identity:
    atomic_ref: "cic:core:Identity@v0.2.0"
    kind: DHCPService
    namespace: "cic:network"
    version: v0.1.dev
    base: "cic:core:ManagedEntity@v0.2.0"
    abstract: false
    description: DHCP szolgáltatás — cím-pool és lease-kezelés

  # ── ConfigSurface ─────────────────────────────────────────────────────────────
  config_surface:
    aggregate_ref: "cic:core:ConfigSurface@v0.2.0"
    nodes:

      - name: enabled
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: boolean
        role: config
        optional: true
        default: true
        description: Szolgáltatás adminisztrációs állapota

      - name: description
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: string
        role: config
        optional: true
        description: Emberi olvasható leírás

      - name: address_family
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: string
        role: config
        mandatory: true
        contract:
          - type: enum
            expression: [ipv4, ipv6]

      - name: subnet
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: string
        role: config
        mandatory: true
        description: A kiszolgált hálózati szegmens CIDR formátumban (pl. 10.0.10.0/24)

      - name: pool_start
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: string
        role: config
        mandatory: true
        description: Cím-pool kezdete (IP cím)

      - name: pool_end
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: string
        role: config
        mandatory: true
        description: Cím-pool vége (IP cím)

      - name: lease_time
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: integer
        role: config
        optional: true
        default: 86400
        description: Lease érvényességi idő másodpercben
        contract:
          - type: range
            expression: "60..2592000"

      - name: gateway
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: string
        role: config
        optional: true
        description: Kiosztott default gateway (DHCP option 3 / IPv6 RA-analóg)

      - name: dns_servers
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: collection
        collection_variant: list
        role: config
        optional: true
        description: Kiosztott DNS szerver cím(ek)

      - name: domain_name
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: string
        role: config
        optional: true
        description: Kiosztott keresési domain (DHCP option 15)

      - name: static_reservations
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: collection
        collection_variant: list
        role: config
        optional: true
        description: >
          Statikus (MAC-hoz kötött) cím-fenntartások — mindig ugyanazt a
          címet kapja a kliens, a pool-tól függetlenül.
        item_fields:
          - name: mac_address
            shape_type: scalar
            scalar_type: string
          - name: ip_address
            shape_type: scalar
            scalar_type: string
          - name: hostname
            shape_type: scalar
            scalar_type: string
            optional: true

  # ── StateSurface ─────────────────────────────────────────────────────────────
  state_surface:
    aggregate_ref: "cic:core:StateSurface@v0.2.0"
    source: dhcp-adapter
    freshness:
      ttl: 30s
      strategy: event-driven
    nodes:

      - name: status
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: string
        role: state
        mandatory: true
        contract:
          - type: enum
            expression: [running, stopped, error]

      - name: active_lease_count
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: integer
        role: state
        description: Aktív (nem lejárt) lease-ek száma

      - name: pool_utilization_percent
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: integer
        role: state
        optional: true
        contract:
          - type: range
            expression: "0..100"

      - name: leases
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: collection
        collection_variant: list
        role: state
        optional: true
        description: Ténylegesen aktív lease-ek listája
        item_fields:
          - name: mac_address
            shape_type: scalar
            scalar_type: string
          - name: ip_address
            shape_type: scalar
            scalar_type: string
          - name: hostname
            shape_type: scalar
            scalar_type: string
            optional: true
          - name: expires_at
            shape_type: scalar
            scalar_type: string
            description: ISO8601 időbélyeg

  # ── OperationSurface ───────────────────────────────────────────────────────────
  operation_surface:
    aggregate_ref: "cic:core:OperationSurface@v0.2.0"
    operations:

      - name: release_lease
        atomic_ref: "cic:core:Behavior@v0.2.0"
        type: action
        idempotent: true
        description: Egy adott lease explicit felszabadítása (IP vagy MAC alapján)
        input:
          - name: ip_address
            shape_type: scalar
            scalar_type: string
            optional: true
          - name: mac_address
            shape_type: scalar
            scalar_type: string
            optional: true
        output:
          - name: released
            shape_type: scalar
            scalar_type: boolean

      - name: reset_pool
        atomic_ref: "cic:core:Behavior@v0.2.0"
        type: action
        idempotent: false
        description: >
          Minden nem-statikus lease felszabadítása — destruktív, csak
          explicit adminisztrátori hívásra (nincs automatikus trigger).
        input: null
        output:
          - name: released_count
            shape_type: scalar
            scalar_type: integer

  # ── NotificationSurface ───────────────────────────────────────────────────────
  notification_surface:
    events:
      - name: lease-assigned
        atomic_ref: "cic:core:Event@v0.2.0"
        trigger: state_change
        severity: info
        description: Új lease kiosztva egy kliensnek
        payload:
          - name: mac_address
            shape_type: scalar
            scalar_type: string
          - name: ip_address
            shape_type: scalar
            scalar_type: string
          - name: hostname
            shape_type: scalar
            scalar_type: string

      - name: lease-released
        atomic_ref: "cic:core:Event@v0.2.0"
        trigger: state_change
        severity: info
        description: Lease felszabadult (lejárt vagy explicit release)
        payload:
          - name: mac_address
            shape_type: scalar
            scalar_type: string
          - name: ip_address
            shape_type: scalar
            scalar_type: string

      - name: pool-exhausted
        atomic_ref: "cic:core:Event@v0.2.0"
        trigger: threshold
        severity: warning
        description: Cím-pool betelt vagy közel a beteléshez
        payload:
          - name: pool_utilization_percent
            shape_type: scalar
            scalar_type: integer

  # ── BindingSurface ────────────────────────────────────────────────────────────
  binding_surface:
    addresses:
      - atomic_ref: "cic:core:Address@v0.2.0"
        schema_path: "/cic-network:dhcp-services/dhcp-service={backend}, {provider}, {location}, {id}"
        api_path: "/restconf/data/cic-network:dhcp-services/dhcp-service={backend}, {provider}, {location}, {id}"
        logical_id: "cic:network:dhcp:{backend}:{provider}:{location}:{id}"
        namespace: "cic:network:dhcp"
        key_fields:
          - name: backend
            type: enum
            values: [isc-dhcp, kea, dnsmasq]
            description: DHCP szerver implementáció
          - name: provider
            type: string
            description: A DHCP szervert futtató host/rendszer azonosítója
          - name: location
            type: string
            description: Rack / panel / "-" ha a provider kezeli
          - name: id
            type: string
            description: >
              Pool/szolgáltatás neve (pl. pool-mgmt) — ezt a `{id}`-t
              hivatkozzák a standards/yang VLAN/L2VLAN blokkok
              `dhcp_service` mezői CIC address stringként
              (pl. "dhcp/server-01/pool-mgmt").
    adapter_capabilities:
      known_adapters: []
      note: >
        Üres szándékosan — nincs még execution-layer adapter (isc-dhcp/
        kea/dnsmasq kontraktus), az adat-oldali munka jelenlegi fókusza
        miatt. A `../switch-netconf-adapter/`/`../ovs-adapter/` mintáját
        kell követnie, amikor a végrehajtási réteg fókuszba kerül.

  yang:
    status: specification-only
    module: cic-network-dhcp
    namespace: "urn:cic:network:dhcp"
    note: >
      Nincs közvetlen IETF/IEEE YANG forrás — ez CIC-natív service-réteg
      objektum, nem egy létező szabvány adaptációja.

  restconf:
    collection: "GET /restconf/data/cic-network:dhcp-services"
    instance: "GET /restconf/data/cic-network:dhcp-services/dhcp-service={backend}, {provider}, {location}, {id}"
    config:
      read: "GET   /restconf/data/cic-network:dhcp-services/dhcp-service={backend}, {provider}, {location}, {id}/config"
      update: "PUT   /restconf/data/cic-network:dhcp-services/dhcp-service={backend}, {provider}, {location}, {id}/config"
      patch: "PATCH /restconf/data/cic-network:dhcp-services/dhcp-service={backend}, {provider}, {location}, {id}/config"
    state:
      read: "GET   /restconf/data/cic-network:dhcp-services/dhcp-service={backend}, {provider}, {location}, {id}/state"
    operations:
      release_lease: "POST /restconf/operations/cic-network:dhcp-services/dhcp-service={backend}, {provider}, {location}, {id}/release-lease"
      reset_pool: "POST /restconf/operations/cic-network:dhcp-services/dhcp-service={backend}, {provider}, {location}, {id}/reset-pool"
    events:
      stream: "GET /restconf/streams/cic-network-dhcp-events"

  runtime:
    reconcile_loop: |
      1. observe:  adapter.get(backend, provider, location, id) → state_surface
      2. compare:  diff(config_surface, state_surface) → drift?
      3. if drift:
           pool_start/pool_end changed → adapter újraírja a pool konfigot
           static_reservations changed → adapter frissíti a fenntartásokat
      4. emit: lease-assigned, lease-released, pool-exhausted events
