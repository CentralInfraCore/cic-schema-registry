# WORKING COPY — not a versioned, signed release file (no -src<year>
# suffix, so tools/registrylib's filename pattern and all registry
# tooling ignore this file entirely: make check/registry_validate/
# generate_latest/signing never see it).
#
# This is the editable source of truth: the latest release
# (rke2-adapter.v0.1.2-src2026.yaml) is frozen and signed, so it can
# never be edited in place (tools/generate_latest.py
# check_no_frozen_edits). Changes happen HERE first; when ready, a new
# rke2-adapter.vX.Y.Z-src<year>.yaml is cut FROM this file's current
# content and signed.
#
# Identical to rke2-adapter.v0.1.2-src2026.yaml except the
# release:/cic_countersign: signature blocks are omitted (this file is
# not itself a signed artifact).
---
metadata:
  name: rke2-adapter
  version: v0.1.2
  description: >
    RKE2 (Rancher Kubernetes Engine 2) adapter — enterprise on-prem Kubernetes,
    CNCF konform, CIS hardened. Közel teljes implementáció.
  owner: Gabor Zoltan Sinko
  tags:
    - adapter-contract
    - kubernetes
    - rke2
    - rancher
    - on-prem
    - enterprise
  validatedBy:
    name: cic-primitives
    version: v0.1.3

spec:
  kind: AdapterContract
  domain: "cic:kubernetes:KubernetesCluster+KubernetesNode"

  protocol: RKE2 API + systemd + kubectl
  implementation: RKE2 — https://docs.rke2.io
  conformance: near-full

  operations:
    - name: observe
      description: kubectl get + rke2 systemctl status + etcd health check
      output:
        ref: KubernetesCluster.state_surface + KubernetesNode.state_surface

    - name: apply
      description: RKE2 config.yaml + systemctl restart rke2-server/agent
      input:
        ref: KubernetesCluster.config_surface + KubernetesNode.config_surface

    - name: watch
      description: kubectl watch + journald events
      output:
        stream: true

  conformance_matrix:
    - target: KubernetesNode.config_surface.sysctls
      type: config_field
      support: unsupported
      reason: OS-szintű konfig — alaprendszer feladata, nem RKE2 API-n

    - target: KubernetesNode.config_surface.ntp_servers
      type: config_field
      support: unsupported
      reason: NTP az OS-szintű konfig — nem RKE2 hatásköre

    - target: KubernetesNode.operation_surface.reset
      type: operation
      support: unsupported
      reason: RKE2 uninstall script — nem API-vezérelt
