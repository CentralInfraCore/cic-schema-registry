---
metadata:
  name: k3s-adapter
  version: v0.1.2
  description: >
    k3s lightweight Kubernetes adapter — on-prem, edge és resource-korlátozott
    környezetekhez. Részleges implementáció — egyes enterprise funkciók hiányoznak.
  owner: Gabor Zoltan Sinko
  tags:
    - adapter-contract
    - kubernetes
    - k3s
    - on-prem
    - lightweight
  validatedBy:
    name: cic-primitives
    version: v0.1.3

spec:
  kind: AdapterContract
  domain: "cic:kubernetes:KubernetesCluster+KubernetesNode"

  protocol: k3s API + systemd + SSH/kubeconfig
  implementation: k3s — https://k3s.io
  conformance: partial

  operations:
    - name: observe
      description: kubectl get + k3s systemctl status
      output:
        ref: KubernetesCluster.state_surface + KubernetesNode.state_surface

    - name: apply
      description: k3s install script + kubeconfig alkalmazás
      input:
        ref: KubernetesCluster.config_surface + KubernetesNode.config_surface

    - name: watch
      description: kubectl watch + journald events
      output:
        stream: true

  conformance_matrix:
    - target: KubernetesCluster.config_surface.etcd
      type: config_field
      support: unsupported
      reason: k3s beépített SQLite vagy etcd-t használ — külső etcd konfig nem támogatott

    - target: KubernetesCluster.config_surface.api_server.audit_policy
      type: config_field
      support: unsupported
      reason: Audit konfig nem elérhető k3s default installban

    - target: KubernetesCluster.config_surface.discovery
      type: config_field
      support: unsupported
      reason: k3s saját node discovery mechanizmust használ (token-alapú)

    - target: KubernetesNode.operation_surface.upgrade
      type: operation
      support: unsupported
      reason: k3s upgrade controller-en keresztül, nem direkt API-n

    - target: KubernetesNode.operation_surface.reset
      type: operation
      support: unsupported
      reason: k3s-uninstall.sh script — nem API-vezérelt
