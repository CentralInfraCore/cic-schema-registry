---
metadata:
  name: kubespray-adapter
  version: v0.1.2
  description: >
    kubespray alapú Kubernetes cluster adapter — Ansible-vezérelt on-prem
    deploymentek. Rugalmas, de OS-szintű konfig az Ansible playbook feladata.
  owner: Gabor Zoltan Sinko
  tags:
    - adapter-contract
    - kubernetes
    - kubespray
    - ansible
    - on-prem
  validatedBy:
    name: cic-primitives
    version: v0.1.3

spec:
  kind: AdapterContract
  domain: "cic:kubernetes:KubernetesCluster+KubernetesNode"

  protocol: Ansible (kubespray playbooks) + kubectl
  implementation: kubespray — https://kubespray.io
  conformance: partial

  operations:
    - name: observe
      description: kubectl get + Ansible facts gyűjtés
      output:
        ref: KubernetesCluster.state_surface + KubernetesNode.state_surface

    - name: apply
      description: kubespray playbook futtatás (cluster.yml / upgrade-cluster.yml)
      input:
        ref: KubernetesCluster.config_surface + KubernetesNode.config_surface
      note: Lassabb mint API-alapú adapterek — Ansible futásidő percekben mérhető

    - name: watch
      description: kubectl watch (nincs natív event stream — polling)
      output:
        stream: false

  conformance_matrix:
    - target: KubernetesNode.config_surface.sysctls
      type: config_field
      support: unsupported
      reason: OS-szintű konfig — külön Ansible role feladata

    - target: KubernetesNode.config_surface.ntp_servers
      type: config_field
      support: unsupported
      reason: NTP az OS konfiguráció része — kubespray playbook nem kezeli direkt

    - target: KubernetesNode.config_surface.cert_sans
      type: config_field
      support: degraded
      reason: kubespray generálja a cert SANokat, manuális override korlátozott

    - target: KubernetesCluster.operation_surface.rotate_certs
      type: operation
      support: unsupported
      reason: Cert rotáció manuális playbook — nem API-vezérelt

    - target: KubernetesNode.operation_surface.reboot
      type: operation
      support: unsupported
      reason: OS-szintű reboot — Ansible task, nem adapter API

    - target: KubernetesNode.operation_surface.reset
      type: operation
      support: unsupported
      reason: reset-cluster.yml playbook — nem API-vezérelt

    - target: KubernetesCluster.config_surface.discovery
      type: config_field
      support: unsupported
      reason: kubespray nem használja a Talos discovery mechanizmust
