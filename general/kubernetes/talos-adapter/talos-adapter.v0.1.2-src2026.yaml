---
metadata:
  name: talos-adapter
  version: v0.1.2
  description: >
    Talos Linux alapú Kubernetes cluster adapter — teljes implementáció, az anchor
    schema referencia implementációja. gRPC API (talosctl).
    A Talos MachineConfig a cic-kubernetes séma fogalmi anchora (dependency.yaml).
  owner: Gabor Zoltan Sinko
  tags:
    - adapter-contract
    - kubernetes
    - talos
    - on-prem
  validatedBy:
    name: cic-primitives
    version: v0.1.3

spec:
  kind: AdapterContract
  domain: "cic:kubernetes:KubernetesCluster+KubernetesNode"

  protocol: gRPC (Talos API v1alpha1)
  implementation: Talos Linux — https://www.talos.dev
  conformance: full-with-orchestration
  orchestration_required: true
  orchestration_scope:
    - control_plane_count enforcement (adapter dönti el hány controlplane node kerül létre)
    - node_pools compute matching (adapter választ ComputeResource-t a requirements alapján)
    - node bootstrap sequencing (control plane előbb, worker utána)

  operations:
    - name: observe
      description: >
        Cluster/node állapot lekérdezése Talos API-n.
        KubernetesCluster: talosctl health + kubectl get nodes
        KubernetesNode: talosctl get machineconfig + kubectl get node
      output:
        ref: KubernetesCluster.state_surface + KubernetesNode.state_surface

    - name: apply
      description: >
        Config alkalmazása Talos machineconfig patch-szel.
        talosctl apply-config --nodes <ip> --file <config.yaml>
        Idempotens — Talos csak a diff-et alkalmazza.
      input:
        ref: KubernetesCluster.config_surface + KubernetesNode.config_surface
      output:
        - name: applied
          type: boolean

    - name: watch
      description: Talos event stream — node kondíció és cluster health változások
      output:
        stream: true
        ref: KubernetesCluster.notification_surface + KubernetesNode.notification_surface

  conformance_matrix: []
  conformance_matrix_semantics: inherited_from_mapping_ref

  mapping_ref: mappings/talos-machineconfig-mapping.yaml
  conformance_proof: mapping-complete

  conformance_notes:
    full_definition: >
      'full' nem jelenti hogy minden CIC mező 1:1 leképezhető egy Talos config
      mezőre. A full conformance azt jelenti hogy minden CIC Kubernetes domain
      mező az alábbiak egyike:
        - directly_mapped: közvetlen Talos config path van rá (mapping_ref-ben)
        - state_derived: Talos/Kubernetes API-ból olvasható (talos_source-ban)
        - adapter_orchestrated: adapter logika kezeli (pl. control_plane_count,
          node_pools compute_requirements — az adapter orchestrálja, nem config mező)
      Ami nem_mapped a mapping_ref-ben: adapter_orchestrated kategória.
