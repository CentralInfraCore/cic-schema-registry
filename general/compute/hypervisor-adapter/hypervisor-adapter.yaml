# WORKING COPY — not a versioned, signed release file (no -src<year>
# suffix, so tools/registrylib's filename pattern and all registry
# tooling ignore this file entirely: make check/registry_validate/
# generate_latest/signing never see it).
#
# This is the editable source of truth: the latest release
# (hypervisor-adapter.v0.2.4-src2026.yaml) is frozen and signed, so it can
# never be edited in place (tools/generate_latest.py
# check_no_frozen_edits). Changes happen HERE first; when ready, a new
# hypervisor-adapter.vX.Y.Z-src<year>.yaml is cut FROM this file's current
# content and signed.
#
# Identical to hypervisor-adapter.v0.2.4-src2026.yaml except the
# release:/cic_countersign: signature blocks are omitted (this file is
# not itself a signed artifact).
---
metadata:
  name: hypervisor-adapter
  version: v0.2.4
  description: >
    Hypervisor adapter interface contract — ComputeResource DomainComposition runtime kötése.
    KVM, VMware, Proxmox, qemu bármelyike implementálhatja.
    Ez NEM implementáció — ez az interface amit minden hypervisor adapternek teljesítenie kell.
    v0.2.4: domain mező (és a leírás) VirtualMachine → ComputeResource
    javítva — a VirtualMachine sosem lett migrált, önálló domain-típus,
    a tényleges, létező típus ComputeResource. Lásd #97.
  owner: Gabor Zoltan Sinko
  tags:
    - adapter-contract
    - compute
    - hypervisor
  validatedBy:
    name: cic-primitives
    version: v0.1.0

spec:
  kind: AdapterContract
  domain: "cic:compute:ComputeResource"
  protocol: "hypervisor-api"

  operations:
    - name: observe
      description: VM aktuális állapotának lekérdezése → state_surface
      input:
        - name: namespace
          type: string
          mandatory: true
        - name: id
          type: string
          mandatory: true
      output:
        - name: power_state
          type: string
          maps_to: state_surface.power_state
        - name: uptime_seconds
          type: integer
          maps_to: state_surface.uptime_seconds
        - name: cpu_usage_pct
          type: number
          maps_to: state_surface.cpu_usage_pct
        - name: memory_usage_mb
          type: integer
          maps_to: state_surface.memory_usage_mb
        - name: ip_addresses
          type: list
          maps_to: state_surface.ip_addresses

    - name: apply
      description: Config változás alkalmazása → config_surface → VM
      input:
        - name: cpu_cores
          type: integer
          maps_to: config_surface.cpu_cores
        - name: memory_mb
          type: integer
          maps_to: config_surface.memory_mb
      precondition: power_state == stopped

    - name: watch
      description: Event stream feliratkozás — aszinkron állapotváltozások
      protocol: websocket
      events:
        - name: power-state-changed
          trigger: state_change
        - name: vm-error
          trigger: explicit

    - name: start
      description: VM indítása
      idempotent: true
      precondition: power_state == stopped
      postcondition: power_state == running

    - name: stop
      description: VM leállítása
      idempotent: true
      input:
        - name: force
          type: boolean
          default: false
      precondition: power_state == running
      postcondition: power_state == stopped

    - name: restart
      description: VM újraindítása
      idempotent: false
      input:
        - name: force
          type: boolean
          default: false

    - name: snapshot
      description: VM pillanatkép készítése
      idempotent: false
      input:
        - name: snapshot_name
          type: string
          mandatory: true
      output:
        - name: snapshot_id
          type: string

    - name: migrate
      description: VM élő migráció másik hypervisorra
      idempotent: false
      input:
        - name: target_host
          type: string
          mandatory: true
      output:
        - name: job_id
          type: string
      precondition: power_state == running

  known_implementations:
    - name: kvm-adapter
      protocol_details: "libvirt XML API / QEMU QMP"
    - name: vmware-adapter
      protocol_details: "VMware vSphere API (govmomi)"
    - name: proxmox-adapter
      protocol_details: "Proxmox VE REST API"
