# WORKING COPY — not a versioned, signed release file (no -src<year>
# suffix, so tools/registrylib's filename pattern and all registry
# tooling ignore this file entirely: make check/registry_validate/
# generate_latest/signing never see it).
#
# This is the editable source of truth: the latest release
# (ietf-interfaces-base.v0.1.5-src2026.yaml) is frozen and signed, so it can
# never be edited in place (tools/generate_latest.py
# check_no_frozen_edits). Changes happen HERE first; when ready, a new
# ietf-interfaces-base.vX.Y.Z-src<year>.yaml is cut FROM this file's current
# content and signed.
#
# Identical to ietf-interfaces-base.v0.1.5-src2026.yaml except the
# release:/cic_countersign: signature blocks are omitted (this file is
# not itself a signed artifact).
---
metadata:
  name: ietf-interfaces-base
  source: RFC 8343 — A YANG Data Model for Interface Management
  version: v0.1.5
  description: >
    Közös interfész building block — minden RFC 8343 interfész típus (physical,
    logical, tunnel) örökli ezeket a mezőket. Nem használható önállóan — mindig
    egy konkrét interfész blokk kiterjeszti.
    v0.1.4: mtu origin jelölve — RFC 8343 §4 (Design) kifejezetten kimondja,
    hogy az ifMtu objektum NINCS leképezve az "ietf-interfaces" modulra,
    és interfésztípus-specifikus modulokra hárítja az MTU-t. A generikus
    mtu itt CIC normalizáció, nem RFC 8343 tartalom. Lásd issue #46.
    v0.1.5: validatedBy javítva cic-yang-block-schema@v0.1.9-re — a tényleges
    belső-struktúra validátor (korábban cic-primitives-re mutatott, ami nem
    ellenőrzi a YANGBlock belső struktúráját). Ténylegesen ellenőrizve
    jsonschema.validate()-tel a block_schema ellen. Lásd #88.

  owner: Gabor Zoltan Sinko
  tags:
    - yang-block
    - ietf
    - rfc8343
    - base
  validatedBy:
    name: cic-yang-block-schema
    version: v0.1.9

spec:
  kind: YANGBlock
  yang_module: ietf-interfaces
  yang_source: RFC 8343
  abstract: true    # nem használható önállóan, csak kiterjesztés alapja

  config:
    - name: name
      type: string
      required_on_create: true
      role: key
      description: Interfész neve (pl. eth0, ge-0/0/1, lo, ovs-br0)

    - name: description
      type: string
      required_on_create: false
      description: Emberi olvasható leírás

    - name: enabled
      type: boolean
      required_on_create: false
      default: true
      description: Adminisztrációs állapot — true=up, false=down

    - name: mtu
      type: integer
      required_on_create: false
      default: 1500
      range: "68..9216"
      description: >
        Maximum Transmission Unit (byte). RFC 8343 §4 kifejezetten kimondja:
        "The ifMtu object from the IF-MIB is not mapped to the
        'ietf-interfaces' module. It is expected that interface-type-
        specific YANG modules provide interface-type-specific MTU leafs by
        augmenting the 'ietf-interfaces' model." — azaz a generikus mtu itt
        CIC normalizáció (kényelmi egyszerűsítés, egy interfész-szintű MTU
        minden típusra), nem az RFC 8343 base modul tartalma. A ténylegesen
        RFC 8344-ből (ietf-ip) származó, cím-család-szintű mtu leaf-ek
        (ipv4/mtu, ipv6/mtu) ettől függetlenek.
      origin: cic-extension

  state:
    - name: admin_status
      type: enum
      values: [up, down, testing]
      description: Konfigurált adminisztrációs állapot (RFC 8343 ifAdminStatus)

    - name: oper_status
      type: enum
      values: [up, down, testing, unknown, dormant, not_present, lower_layer_down]
      description: >
        Tényleges operációs állapot (RFC 8343 ifOperStatus).
        lower_layer_down: szülő interfész nincs fenn.

    - name: phys_address
      type: mac-address
      required_on_create: false
      description: MAC cím (pl. 00:1a:2b:3c:4d:5e)

    - name: last_change
      type: datetime
      format: iso8601
      required_on_create: false
      description: Utolsó oper_status változás időbélyege

    - name: statistics
      type: object
      required_on_create: false
      description: Forgalmi számlálók (RFC 8343 ifCounterDiscontinuityTime alapján)
      properties:
        in_octets:
          type: integer
          description: Fogadott byte-ok száma
        in_pkts:
          type: integer
          description: Fogadott csomagok száma
        in_errors:
          type: integer
          description: Fogadási hibák száma
        in_discards:
          type: integer
          description: Eldobott fogadott csomagok (puffer túlcsordulás stb.)
        out_octets:
          type: integer
          description: Küldött byte-ok száma
        out_pkts:
          type: integer
          description: Küldött csomagok száma
        out_errors:
          type: integer
          description: Küldési hibák száma
        out_discards:
          type: integer
          description: Eldobott küldendő csomagok
