# WORKING COPY — not a versioned, signed release file (no -src<year>
# suffix, so tools/registrylib's filename pattern and all registry
# tooling ignore this file entirely: make check/registry_validate/
# generate_latest/signing never see it).
#
# This is the editable source of truth: the latest release
# (cic-yang-block-schema.v0.1.9-src2026.yaml) is frozen and signed, so it can
# never be edited in place (tools/generate_latest.py
# check_no_frozen_edits). Changes happen HERE first; when ready, a new
# cic-yang-block-schema.vX.Y.Z-src<year>.yaml is cut FROM this file's current
# content and signed.
#
# Identical to cic-yang-block-schema.v0.1.9-src2026.yaml except the
# release:/cic_countersign: signature blocks are omitted (this file is
# not itself a signed artifact).
---
metadata:
  name: cic-yang-block-schema
  source: CIC internal
  version: v0.1.9
  description: >
    Meta-schema a cic-yang YANGBlock fájlok belső struktúrájának validálásához.
    Az index.yaml csak kind/yang_module/yang_source kötelezőségét ellenőrzi.
    Ez a schema a config/state/notifications mezők belső konzisztenciáját validálja.
    v0.1.4: az origin enum (field_schema és notifications egyaránt) rfc8516
    értéke ieee8021ab-re cserélve — a v0.1.3 tévesen engedte az rfc8516-ot
    LLDP forrásként, ami valójában egy CoAP hibakód. Lásd issue #42.
    v0.1.5: field_schema.values elemei mostantól az Access atom rövid/hosszú
    alakját követhetik (primitives-group/primitives/schemas/atomic/
    access.yaml) — sima string ("up") VAGY {value, conformance} objektum
    ({value: testing, conformance: not_implemented}), nem csak sima string.
    Ez teszi lehetővé, hogy egy extends-elt blokk explicit jelölje, mely
    örökölt enum-értékeket nem implementálja, ahelyett hogy csendben
    kihagyná őket a listából (amit a #45 talált a tunnel/vlan
    oper_status-án). Lásd issue #45.
    v0.1.6: field_schema.role lecserélve a cic-primitives@v0.2.0 Role atom
    három-tengelyes kombinációs algebrájára (authority/structural/
    lifecycle) — a flat [key, config, state, operational, reference] enum
    csak egy dimenziót tudott kifejezni. A pontos instance-forma a
    proposals/atom-grammar/instance-grammar.schema.yaml-ből átvéve, nem
    saját kitalálás. Adatmigráció NEM kellett: a corpuson kizárólag
    `role: key` fordul elő, ami rövid alakként ma is érvényes marad
    ({authority: config, structural: [key]}). Lásd issue #43.
    v0.1.7: két önellentmondás javítva. (1) #101: a fájl saját metadata
    blokkja nem tartalmazott source mezőt, miközben a lentebbi
    metadata.required lista minden YANGBlock fájlon (magán a meta-sémán
    is) kötelezővé teszi — most már ez a fájl is megfelel a saját maga
    definiálta struktúrának. (2) #84: field_schema.required_when nem
    deklarálta az in property-t, amit a corpus már 3 helyen ténylegesen
    használ (ietf-nat, translation_type alapján feltételes mezők) — a
    testvér applicable_when mintáját követve pótolva. Mindkét
    feltétel-objektumhoz (applicable_when, required_when) hozzáadva
    additionalProperties: false is, hogy egy jövőbeli elgépelt/nem-
    dokumentált operátor (pl. "contains" "in" helyett) tényleges
    validációs hibaként bukjon, ne csendben átmenő extra property
    legyen. Ellenőrizve: a teljes standards/yang corpus egyik
    applicable_when/required_when blokkja sem használ a field/equals/in
    hármason kívüli kulcsot, tehát a szigorítás semmit nem tör el a
    meglévő tartalomból.
    v0.1.8: #87 rövid-távú fele — az origin enum bővítve rfc8512-vel
    (ietf-nat saját metadata.source-a ez, de az enum eddig nem tudta
    kifejezni) és iana-if-type-tal (ietf-interfaces-l2vlan saját
    metadata.source-a "RFC 8343 + IANA-IF-TYPE l2vlan", ugyanez a
    hiányzó kategória). Mindkét enum-előfordulás (field_schema.origin,
    notifications[].origin) frissítve. Szándékosan NEM része: a corpus
    meglévő mezőinek utólagos átcímkézése (pl. ietf-nat mezői jelenleg
    mind cic-extension, vlan_id jelenleg rfc8343 — ezek RFC 8512/
    iana-if-type-re állítása RFC-szöveg-szintű ellenőrzést igényelne,
    a #46 mintájára, nem ennek a PR-nek a scope-ja); a hosszabb-távú,
    strukturált provenance blokk (authority/document/module/relation)
    szintén NEM ennek a PR-nek a része. Lásd issue #87.
    v0.1.9: #83 — item_fields/properties/notifications[].payload eddig
    csak type: array / type: object szinten voltak megkötve, a belsejük
    validálatlan volt (bármi átment: rossz type, hiányzó kötelező kulcs,
    elgépelt property-név). field_schema.required most [type] (a name
    NEM kötelező a definíción magán), és a tömb-kontextusok (config,
    state, item_fields, notifications[].payload) mindegyike
    `allOf: [$ref field_schema, required: [name]]`-lel egészíti ki —
    ott a name továbbra is kötelező, változatlanul, csak nem a
    field_schema saját, hanem a használati hely felelőssége. A properties
    (dict-alakú, type=object esetén) `additionalProperties: {$ref:
    field_schema}`-t kapott, name-követelmény NÉLKÜL — a valós corpus
    properties-tartalma (pl. ietf-ip-v6/ietf-interfaces-base statisztikák,
    dhcp-overrides) sosem hordoz name kulcsot, mert a dict-kulcs maga a
    mezőnév; egy egységes field_schema-ra való name-kényszerítés minden
    ilyen fájlt elbuktatott volna. Ellenőrizve: a teljes standards/yang
    corpus minden config/state/item_fields/properties/notifications
    payload tartalma megfelel ennek a szigorúbb, immár rekurzív
    struktúrának — semmit nem tör el a meglévő tartalomból. FONTOS
    KORLÁT: ez a meta-séma jelenleg NINCS bekötve semmilyen valódi
    jsonschema.validate() hívásba a corpus ellen (az egyetlen
    jsonschema.validate a tools/infra.py-ban a project.yaml-t validálja,
    más sémával) — ez a fix a séma DEFINÍCIÓJÁT teszi belsőleg
    helyessé, de önmagában nem ad tényleges enforcementet, amíg nincs
    mögötte futó validátor (lásd #88/#101). Lásd issue #83.
  owner: Gabor Zoltan Sinko
  tags:
    - meta-schema
    - yang-block
  validatedBy:
    name: self
    version: v0.0.dev

spec:
  kind: YANGBlock
  yang_module: cic-yang-meta
  yang_source: CIC internal

  # ── A YANGBlock belső struktúra sémája ────────────────────────────────────────
  block_schema:
    $defs:
      field_schema:
        type: object
        # #83: name NEM kötelező itt -- a properties (dict-alakú, type=
        # object) kontextusban a dict-kulcs maga a mezőnév, a value-nak
        # nincs saját name property-je a valós corpuson. A tömb-
        # kontextusok (config/state/item_fields/notifications.payload)
        # required: [name]-t adnak hozzá allOf-fal, lásd lentebb.
        required: [type]
        properties:

          name:
            type: string
            pattern: "^[a-z][a-z0-9_]*$"
            description: snake_case mezőnév

          type:
            type: string
            enum:
              # Primitív típusok
              - string
              - integer
              - boolean
              - number
              # Szemantikus típusok
              - mac-address
              - ipv4-address
              - ipv4-prefix
              - ipv6-address
              - ipv6-prefix
              - ip-address
              - ip-prefix
              - vlan-id
              - interface-ref
              - datetime
              # Összetett típusok
              - enum
              - list
              - object
              - ref

          required_on_create:
            type: boolean
            default: false
            description: Kötelező-e létrehozáskor explicit megadni

          default:
            description: Alapértelmezett érték (ha required_on_create=false)

          # Átvéve: proposals/atom-grammar/instance-grammar.schema.yaml
          # (primitives-group/primitives), cic-primitives@v0.2.0 Role atom
          # instance-formája — nem saját kitalálás. "reference" NEM
          # szerepel a rövid alak enumjában: az authority-ja nem
          # levezethető (lásd README §3.1), csak hosszú alakban írható.
          role:
            oneOf:
              - type: string
                enum: [config, state, operational, key, derived, volatile]
              - type: object
                required: [authority]
                additionalProperties: false
                properties:
                  authority:
                    type: string
                    enum: [config, state, operational]
                  structural:
                    type: array
                    uniqueItems: true
                    items:
                      type: string
                      enum: [key, reference]
                  lifecycle:
                    type: string
                    enum: [derived, volatile]

          origin:
            type: string
            enum: [rfc8343, rfc8344, rfc8512, ieee8021ab, iana-if-type, openconfig, cic-extension]
            description: >
              Mező eredete — RFC-ből, IEEE szabványból, vagy CIC normalizációból.
              rfc8516 szándékosan nincs itt: az egy CoAP hibakód (RFC 8516,
              "Too Many Requests"), sosem volt LLDP YANG — lásd #42. Az LLDP
              szabványos forrása IEEE 802.1ABcu-2021, nem IETF RFC.

          capability:
            type: string
            description: Ha meg van adva, csak az ezt támogató adapternél értelmezett

          applicable_when:
            type: object
            additionalProperties: false
            properties:
              field:
                type: string
              equals:
                description: Skaláris érték
              in:
                type: array
                description: Értékek listája
            description: Feltétel ami alapján a mező értelmezett

          required_when:
            type: object
            additionalProperties: false
            properties:
              field:
                type: string
              equals:
                description: Ha ez a feltétel teljesül, a mező kötelező
              in:
                type: array
                description: Értékek listája — a mező kötelező, ha field
                  értéke ezek egyike (lásd applicable_when.in, ugyanaz a
                  minta; a corpus már használja, pl. ietf-nat)
            description: Feltételes kötelezőség

          # Enum-specifikus
          values:
            type: array
            items:
              # Access atom rövid/hosszú alakja (primitives-group/primitives/
              # schemas/atomic/access.yaml) — "up" VAGY {value, conformance}.
              # A hosszú alak arra való, hogy egy extends-elt blokk explicit
              # jelölje: az örökölt enum melyik értékét nem implementálja —
              # ne csendben hagyja ki a values listából (#45).
              oneOf:
                - type: string
                - type: object
                  required: [value, conformance]
                  properties:
                    value:
                      type: string
                    conformance:
                      type: string
                      enum: [implemented, not_implemented, deprecated]
            description: >
              Enum értékek listája (type=enum esetén kötelező). Elemei
              sima string VAGY {value, conformance} objektum — lásd fent.

          # List-specifikus
          item_type:
            type: string
            description: Lista elemeinek típusa (type=list, egyszerű elem esetén)

          item_fields:
            type: array
            items:
              allOf:
                - $ref: "#/$defs/field_schema"
                - required: [name]
            description: Lista elemeinek mezői (type=list, összetett elem esetén)

          # Object-specifikus
          properties:
            type: object
            additionalProperties:
              $ref: "#/$defs/field_schema"
            description: >
              Object belső mezői (type=object esetén). Kulcs = mezőnév,
              érték = field_schema (name NÉLKÜL — a dict-kulcs maga a
              name, lásd field_schema.required fentebb).

          # Ref-specifikus
          target_kind:
            type: string
            description: Mire mutat a referencia (pl. DHCPService, YANGBlock)

          # Számértékes korlátok
          range:
            type: string
            pattern: "^[0-9]+\\.\\.[0-9]+$"
            description: "Értéktartomány (pl. 1..4094)"

          unit:
            type: string
            description: Mértékegység (pl. Mbps, byte)

          format:
            type: string
            description: Formátum spec (pl. iso8601, cidr)

    type: object
    required: [metadata, spec]
    properties:

      metadata:
        type: object
        required: [name, source, version, description, owner, tags, validatedBy]
        properties:
          name:
            type: string
            pattern: "^(ietf|openconfig|cic)-[a-z0-9-]+$"
            description: Naming konvenció — prefix jelzi az origint
          source:
            type: string
            description: Forrás RFC vagy spec (pl. "RFC 8343 — ietf-interfaces")
          version:
            type: string
            pattern: "^v[0-9]+\\.[0-9]+(\\.[0-9]+)?(-[a-z0-9]+)?$"

      spec:
        type: object
        required: [kind, yang_module, yang_source]
        properties:

          kind:
            type: string
            enum: [YANGBlock]

          yang_module:
            type: string
            description: YANG modul neve (pl. ietf-interfaces, ietf-ip)

          yang_source:
            type: string
            description: Forrás dokumentum (pl. RFC 8343, OpenConfig)

          abstract:
            type: boolean
            default: false
            description: true = csak kiterjesztés alapja, önállóan nem használható

          standalone:
            type: boolean
            default: true
            description: false = mindig szülő building blockhoz kötött

          extends:
            type: object
            required: [name, version]
            properties:
              name:
                type: string
              version:
                type: string
            description: Szülő building block aminek mezőit örökli

          interface_types:
            type: array
            items:
              type: string
            description: RFC 8343 / IANA-IF-TYPE értékek amiket ez a blokk fed

          ip_version:
            type: string
            enum: [ipv4, ipv6]
            description: RFC 8344 blokkoknál az IP verzió

          config:
            type: array
            items:
              allOf:
                - $ref: "#/$defs/field_schema"
                - required: [name]
            description: Config tree mezők (RFC 8343 config container analóg)

          state:
            type: array
            items:
              allOf:
                - $ref: "#/$defs/field_schema"
                - required: [name]
            description: State tree mezők (RFC 8343 state container, read-only)

          notifications:
            type: array
            items:
              type: object
              required: [name, description]
              properties:
                name:
                  type: string
                description:
                  type: string
                origin:
                  type: string
                  enum: [rfc8343, rfc8344, rfc8512, ieee8021ab, iana-if-type, openconfig, cic-extension]
                payload:
                  type: array
                  items:
                    allOf:
                      - $ref: "#/$defs/field_schema"
                      - required: [name]
