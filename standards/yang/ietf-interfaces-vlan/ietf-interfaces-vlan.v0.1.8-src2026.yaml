---
metadata:
  name: ietf-interfaces-vlan
  source: RFC 8343 + CIC L2 VLAN extension
  version: v0.1.8
  description: >
    VLAN szegmens building block — IEEE 802.1Q VLAN tagging, access/trunk/hybrid mód.
    Mindig fizikai VAGY logikai interfészhez kötött, soha nem standalone.
    A dhcp_service referencia egy külső DHCP service-re mutat (service réteg).
    Megjegyzés: a vlan_mode (access/trunk/hybrid) CIC L2 extension — az RFC 8343
    l2vlan type-hoz képest kiegészítő switchport-absztrakció.
    v0.1.4: native_vlan mostantól hybrid módban is érvényes — lásd issue #19.
    v0.1.5: oper_status visszakapta a base mind a 7 értékét — a v0.1.4
    csendben 3-ra szűkítette (testing/dormant/not_present/lower_layer_down
    eltűnt), amit a #45 extends-coverage ellenőrzése elkapott. A 4 hiányzó
    érték most explicit conformance: not_implemented — a vokabulárium nem
    csökkent, csak az látszik, mit implementál ma ez a blokk.

    v0.1.6: config.name mező átnevezve vlan_name-re, ugyanaz a hiba (és
    ugyanaz a javítás), mint amit a #82 az ietf-interfaces-l2vlan-ban
    talált és javított — ez a blokk innen lett byte-szinten kiválasztva
    (#47), a hiba tehát öröklődött. FONTOS: ez a blokk #47 óta
    DEPRECATED — az adapterek (switch-netconf-adapter, ovs-adapter,
    network-interface) az ietf-interfaces-l2vlan + cic-switchport-vlan
    blokk-párat referenciázzák, nem ezt. Ez a verzió KIZÁRÓLAG azért
    készült, hogy a #82-ben szigorított check_yang_extends (role/
    required_on_create is a shape-signature része) ne bukjon el a teljes
    corpuson egy már ismert, de a régi ellenőrzés által nem látott
    hibától — nem ennek a blokknak az aktív továbbfejlesztése.

    v0.1.7: extends.version valós pinre cserélve (v0.0.dev helyett
    ietf-interfaces-base@v0.1.4), ugyanazért az okért mint a v0.1.6 —
    a #81-ben szigorított check_yang_extends explicit hibát dobna egy
    placeholder verzióra, ha ez a LATEST fájl nem kapna valós pint. Lásd
    #81.
    v0.1.8: validatedBy javítva cic-yang-block-schema@v0.1.9-re — a tényleges
    belső-struktúra validátor (korábban cic-primitives-re mutatott, ami nem
    ellenőrzi a YANGBlock belső struktúráját). Ténylegesen ellenőrizve
    jsonschema.validate()-tel a block_schema ellen. Lásd #88.

  owner: Gabor Zoltan Sinko
  tags:
    - yang-block
    - ietf
    - rfc8343
    - vlan
  validatedBy:
    name: cic-yang-block-schema
    version: v0.1.9

spec:
  kind: YANGBlock
  yang_module: ietf-interfaces
  yang_source: RFC 8343
  interface_types:
    - l2vlan              # IEEE 802.1Q VLAN (RFC 8343)

  extends:
    name: ietf-interfaces-base
    version: v0.1.4
  standalone: false       # mindig szülőhöz kötött (physical vagy logical)

  config:
    - name: vlan_id
      type: vlan-id
      range: "1..4094"
      required_on_create: true
      role: key
      description: VLAN azonosító (IEEE 802.1Q)
      origin: rfc8343

    - name: vlan_name
      type: string
      required_on_create: false
      description: >
        VLAN neve / leírása (display label — NEM az örökölt
        ietf-interfaces-base.name interfész-identitás mező). Lásd #82.
      origin: cic-extension

    - name: vlan_mode
      type: enum
      values: [access, trunk, hybrid]
      required_on_create: false
      default: access
      description: >
        Port VLAN működési mód.
        access: egy VLAN, untagged forgalom.
        trunk: több VLAN, tagged forgalom (allowed_vlans lista alapján).
        hybrid: vegyes — egyes VLAN-ok tagged, mások untagged.
      origin: cic-extension

    - name: allowed_vlans
      type: list
      item_type: vlan-id
      required_on_create: false
      applicable_when:
        field: vlan_mode
        in: [trunk, hybrid]
      description: >
        Engedélyezett, TAGGED VLAN ID-k trunk/hybrid módban. Üres = minden
        VLAN engedélyezett (trunk default). Hybrid módban a native_vlan
        NEM ide tartozik — az az egy, untagged kivétel (lásd ott).
      origin: cic-extension

    # issue #19: korábban `equals: trunk` volt — a hybrid mód saját
    # leírása szerint "vegyes: egyes VLAN-ok tagged, mások untagged", de
    # az egyetlen mező, ami untagged VLAN-t tud kifejezni (native_vlan),
    # ki volt zárva pont ebből a módból. Egy port (trunk vagy hybrid)
    # tipikusan egyetlen untagged/native VLAN-t enged (ugyanaz a modell,
    # mint pl. Cisco "switchport mode general" natív VLAN-ja) — ezt fejezi
    # ki a native_vlan, MINDEN más engedélyezett VLAN (allowed_vlans)
    # pedig tagged. Ha a jövőben több egyidejű untagged VLAN-t kellene
    # támogatni egy hybrid porton, az már egy per-VLAN {id, tagged}
    # struktúrát igényelne — ezt a jelenlegi valós adapterek egyike sem
    # igényli, ezért itt nem vezetjük be korai absztrakcióként.
    - name: native_vlan
      type: vlan-id
      required_on_create: false
      default: 1
      applicable_when:
        field: vlan_mode
        in: [trunk, hybrid]
      description: >
        Az egyetlen untagged/native VLAN trunk VAGY hybrid porton
        (default: 1). Minden más, allowed_vlans-ban felsorolt VLAN tagged.
      origin: cic-extension

    - name: dhcp_service
      type: ref
      target_kind: DHCPService
      required_on_create: false
      description: >
        Referencia egy DHCP service resource-ra amely erre a VLAN-ra oszt
        IP címeket. Service réteg — máshol definiált, ez csak pointer.
        Formátum: CIC address string (pl. "dhcp/server-01/pool-mgmt")
      origin: cic-extension

  state:
    - name: oper_status
      type: enum
      values:
        - up
        - down
        - unknown
        - value: testing
          conformance: not_implemented
        - value: dormant
          conformance: not_implemented
        - value: not_present
          conformance: not_implemented
        - value: lower_layer_down
          conformance: not_implemented
      description: >
        Operációs állapot. A teljes vokabulárium a base oper_status-ét
        örökli (ietf-interfaces-base); ma csak up/down/unknown van
        implementálva, a többi explicit not_implemented.
      origin: rfc8343

    - name: mac_table_entries
      type: integer
      description: Aktuális MAC tábla bejegyzések száma ezen a VLAN-on
      origin: cic-extension
