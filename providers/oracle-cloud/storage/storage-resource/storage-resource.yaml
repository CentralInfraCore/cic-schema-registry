metadata:
  name: StorageResourceOracleCloud
  version: v0.1.dev
  description: >
    Oracle Cloud Infrastructure altípusa a canonical StorageResource-nek
    (general/storage/storage-resource/), az OCI Volume + VolumeAttachment +
    Monitoring ellen verifikálva. Alapja a theads/thead04.txt review 7/7
    független ellenőrzéssel megerősített állítása (5 CONFIRMED, 1 részben,
    1 WRONG — lásd thead04.meta.yaml).

    Korábbi verzió (ugyanezen path alatt) `kind: AdapterContract`-ként,
    külön korrekció-dokumentumként írta le ugyanezt a tartalmat, a `domain`
    kulcson keresztül csak visszahivatkozva a canonical StorageResource-ra
    — ez tévesen az `AdapterContract` kind jelentését (observe/apply/watch
    interfész-szerződés BÁRMELYIK implementációhoz, lásd
    general/storage/storage-adapter/README.md) helyettesítette be egy
    mező-szintű megfelelés-térképpel, holott a feladat a sémát leíró
    objektum öröklése volt, nem az objektum-instance szintű dokumentálása.

    Ez a verzió ehelyett valódi `kind: DomainComposition` séma, ami a
    `spec.identity.base` / `spec.base.ref` pin-en (tools/registrylib/
    identity.py, "cic:storage:StorageResource@v0.1.5" formátum) keresztül
    örökli magát a StorageResource séma-objektumot — ugyanazzal a
    mechanizmussal, ahogy a StorageResource maga örököl a
    cic:core:ManagedEntity kernel-aggregátumtól. A nem támogatott mezőt
    (filesystem) strukturálisan, `access.conformance: not_implemented`
    narrowing-gal jelöli — ezt tools/registrylib/coverage.py már ismeri
    (D-012 "acknowledged conformance" halmaz), nem prózai `reason:`
    stringgel.

    NYITOTT, NEM VERIFIKÁLT PONT: ez az első eset a corpuson belül, hogy
    egy `identity.base` pin nem kernel-aggregátumra (cic:core:*), hanem
    egy másik domain-objektumra (cic:storage:StorageResource) mutat.
    identity.py resolve_pin()-je formailag elfogadja (a pin-formátum
    namespace-agnosztikus, a docstring saját példája is
    "cic:storage:StorageResource@v1.0.0"), és tools/registry_validate.py
    check_base_references() ténylegesen kezel domain-to-domain base
    pineket (nem csak kernel bundle-t) — ez implementálva van, nem
    scaffold. A DE: ez a fájl maga JELENLEG kívül esik ezen az
    ellenőrzésen, mert a fájlnév (`storage-resource.yaml`, nincs
    `-src<év>` végződés) nem illeszkedik a tools/registrylib/paths.py
    `_FILENAME_RE`-jére — ugyanaz a "working copy, tooling által
    szándékosan figyelmen kívül hagyva, amíg release nem lesz belőle"
    konvenció, amit a canonical storage-resource.yaml saját fejléce is
    leír. Emiatt a "registry_validate zöld" tény korábban tévesen lett
    idézve itt bizonyítékként — valójában a fájl láthatatlan a scanner
    számára, nem validálva lett. Közvetlenül meghívva
    tools/registrylib/coverage.py check_coverage()-öt (a discovery-réteg
    megkerülésével) a base (StorageResource@v0.1.5) és e fájl között:
    0 violation a config_surface/state_surface/operation_surface
    restatementre — ez tényleg helyes. Ha/amikor ez a fájl release-be
    kerül (-src<év>.yaml néven), a check_base_references() a fenti,
    valódi mechanizmuson fut majd le ellene.

    policy_surface / derivation_chain szándékosan NINCS itt
    megismételve — ezeket tools/registrylib/coverage.py
    `_NODE_LIST_KEYS`-e nem ellenőrzi (csak config_surface/
    state_surface/operation_surface/notification_surface node-listáit),
    tehát a hiányuk nem okoz coverage violationt még release után sem.
    Ez viszont csak a tooling vakfoltja, nem architekturális döntés —
    az "explicit full restatement, nincs implicit öröklés"
    dokumentált elv (coverage.py check_coverage() docstring) szerint
    ez a két surface is logikailag idetartozna. Nyitva hagyva:
    derivation_chain restate-je cic-primitives#6 (domain-object
    szemantika vs. schema-provenance) eldöntésétől függ — lásd
    cic-schema-registry#131.

    binding_surface VISZONT most már TELJESEN meg van ismételve (#131,
    thead12 — egy külső review helyesen mutatott rá, hogy egy RÉSZLEGES
    binding_surface restatement ellentmondana a saját magunk által
    idézett "explicit full restatement, nincs implicit öröklés" elvnek:
    ha a hiányzó tagok öröklődnének a bázisból, az implicit öröklés
    lenne; ha nem, a specializációnak nem lenne adapter/kapabilitása,
    ami abszurd. A helyes válasz az volt, hogy a teljes surface-t kiadjuk,
    nem a részlegeset megtartjuk):

      - addresses[].key_fields: örökölt Shape-mező-lista, ugyanolyan
        jellegű, mint a config_surface/state_surface node-jai — itt a
        "explicit full restatement" a config_surface-ével azonos
        formában alkalmazandó (minden mező jelen van, vagy per-value
        conformance-szal szűkítve). `backend` a bázison feltétel nélküli
        Contract-enumot visel (`[hypervisor, san, cloud]`), ez
        cic-primitives#5 (Address key_fields formalizálás) óta
        biztonságosan szűkíthető per-érték conformance-szal (#137
        mintája, nem Contract-szűkítés — LSP-t megtartva ugyanúgy, ahogy
        thead11 pontosítja: TYPE/VOCABULARY szinten a teljes vokabulárium
        megmarad, csak IMPLEMENTATION CAPABILITY szinten szűkül).
        `provider` SZÁNDÉKOSAN nem kapott hasonló Contract-narrowing-ot:
        a bázison a jelentése a `backend` értékétől függ (hypervisor/san
        esetén szabad azonosító, csak cloud esetén valódi enum), ezért
        ott sincs feltétlen Contract-enum rajta, csak próza — ide
        Contract-ot tenni tévesen a hypervisor/san eseteket is a
        cloud-enumra korlátozná. Ez a "mező kontraktusa feltételes egy
        szomszédos mező értékétől" hiány ugyanaz a kifejezőerő-rés, mint
        amit cic-primitives#8 collection-elemekre már dokumentál
        (thead10) — itt egy scalar key_field szintjén jelenik meg.

      - adapter/adapter_capabilities.known_adapters: MÁS jellegű
        tartalom — nem örökölt Shape-mező, hanem statikus tény-lista
        arról, milyen backend/provider kombinációt szolgál ki ténylegesen
        az adapter-implementáció (check_grammar.py NODE_CONTAINERS sem
        kezeli Shape-node-ként). Itt a "teljes restatement" nem az összes
        bázis-bejegyzés megismétlését jelenti (a hypervisor/san
        bejegyzések fizikailag sosem relevánsak egy OCI-specifikus
        adapterre), hanem a specializációra ténylegesen érvényes,
        önálló, teljes tényhalmaz kiadását — itt egyetlen
        `backend: cloud, provider: oci` bejegyzés. Ez alkalomból javítva
        a korábban dokumentálatlan következetlenség is: a bázis
        cloud-bejegyzésének `capabilities` listája tartalmazza a
        `filesystem`-et, holott a config_surface.filesystem mező OCI-n
        `access.conformance: not_implemented` — a specializáció
        `capabilities` listájából a `filesystem` most kimaradt.

      A két eltérő öröklési szemantika (örökölt mező-lista vs. tény-
      lista) formális megkülönböztetése nincs kernel-szinten kimondva —
      ez itt csak erre a konkrét esetre lett alkalmazva, nem általános
      elvként rögzítve. Lásd thead12 4. szakasza.

    A filesystem mezőnél talált, MÉG NYITOTT ellentmondás a
    general/storage/storage-adapter/ generikus cloud-backend
    capabilities-listájával (lásd a mező access/description mezőjét)
    továbbra is fennáll, változatlanul.

    Frissítés: a canonical StorageResource encryption (boolean) mezőjét
    encryption_mode (enum) váltotta fel, v1.0.0-ban — pontosan az a
    modell-váltás, amit ez a fájl korábban
    "nem ennek a fájlnak a scope-ja"-ként jelölt. A base pin frissítve
    v1.0.0-ra, az encryption_mode mező teljes egészében átvéve (a teljes
    enum-lista, nem szűkítve — lásd a mező saját description-jét: a
    Contract-szűkítés ma nem lehetséges identity.base specializációban,
    mert tools/registrylib/coverage.py check_base_references() minden
    ilyen ellenőrzést major_bump=False-szal futtat, függetlenül attól,
    hogy a base épp MAJOR-t lépett-e).
  owner: Gabor Zoltan Sinko
  tags:
    - domain-composition
    - storage
    - oracle-cloud
  validatedBy:
    name: cic-primitives
    version: v0.2.0

spec:
  kind: DomainComposition
  base:
    aggregate: StorageResource
    ref: "cic:storage:StorageResource@v1.2.0"

  provider_resources:
    - core.Volume
    - core.VolumeAttachment
    - monitoring.Metric

  # ── Identity ─────────────────────────────────────────────────────────────────
  identity:
    atomic_ref: "cic:core:Identity@v0.2.0"
    kind: StorageResourceOracleCloud
    namespace: "cic:storage"
    version: v0.1.dev
    base: "cic:storage:StorageResource@v1.2.0"
    abstract: false
    description: Oracle Cloud Infrastructure altípusa a platform-agnosztikus block volume erőforrásnak

  # ── ConfigSurface ─────────────────────────────────────────────────────────────
  config_surface:
    aggregate_ref: "cic:core:ConfigSurface@v0.2.0"
    nodes:

      - name: size_gb
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: integer
        role: config
        mandatory: true
        description: Volume mérete GB-ban. OCI Volume.sizeInGBs — közvetlen, 1:1.
        contract:
          - type: range
            expression: "1..65536"

      - name: access_mode
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: string
        role: config
        mandatory: true
        description: >
          Hozzáférési mód. OCI-n nincs egyetlen mező — az isReadOnly +
          isShareable Volume-mezők kombinációjából vezethető le
          (read_write_once/read_only_many/read_write_many → a kettő
          párja).
        contract:
          - type: enum
            expression: [read_write_once, read_only_many, read_write_many]
        capability_values:
          read_only_many: multi_attach
          read_write_many: multi_attach

      - name: filesystem
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: string
        role: config
        optional: true
        capability: filesystem
        access:
          conformance: not_implemented
        description: >
          Filesystem típus (none = raw block device). Az OCI Volume
          API-nak (és általában a block storage API-knak: EBS,
          Persistent Disk) nincs filesystem-fogalma — a fájlrendszert a
          guest OS hozza létre a csatolás után (mkfs), ez OCI API-szinten
          nem látszik.
          NYITOTT ELLENTMONDÁS: a general/storage/storage-adapter/
          generikus adapter cloud-backend capabilities-listája ma
          explicit TÁMOGATOTTKÉNT sorolja fel a filesystem-et [aws, gcp,
          azure, hcloud, do, ovh, oci] providerekre (storage-adapter.yaml,
          capabilities: [filesystem, ...] a cloud backend alatt) — ez a
          narrowing ezzel szemben áll, nem lett összhangba hozva vele,
          mert az a fájl saját, külön kérdés (nem ennek a fájlnak a
          felelőssége eldönteni, melyik állítás a helyes).
        contract:
          - type: enum
            expression: [ext4, xfs, ntfs, btrfs, none]

      - name: encryption_mode
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: string
        role: config
        optional: true
        default: unspecified
        capability: encryption
        description: >
          At-rest titkosítás módja. OCI minden Block/Boot Volume-ot
          kötelezően AES-256-tal titkosít at-rest — "unencrypted"
          (none) és guest_managed állapot OCI-n gyakorlatban nem
          fordul elő, a mező itt csak unspecified/provider_managed/
          customer_managed között mozog ténylegesen (lásd
          encryption_key_ref). A canonical encryption_mode enumot a
          StorageResource v1.0.0 vezette be (korábban `encryption:
          boolean` volt, ami OCI-n értelmezhetetlen intent volt — lásd
          theads/thead04.txt), az `unspecified` értéket pedig v1.2.0
          (lásd #140).

          #137 (thead07/thead08) megoldva: a `none`/`guest_managed`
          most `conformance: not_implemented`-tel jelölt EGYEDI ÉRTÉKEK
          a Contract enumon belül (a YANG-dialektus {value, conformance}
          hosszú alakja, portolva a DomainComposition oldalra) — a teljes
          vokabulárium
          (unspecified/none/provider_managed/customer_managed/
          guest_managed) megmarad. Ez két KÜLÖN dolgot jelent, nem egyet:

          TYPE/VOCABULARY szinten a mező a StorageResource bázissal
          azonos marad — egy általános StorageResource-kliens által
          leírt `encryption_mode: none` intent ezen a specializáción is
          séma-szinten legális marad (nem lesz Contract-szűkítés/mutated
          shape, lásd thead08 kritikája a korábbi contract_narrowing
          kísérletről). A tools/registrylib/coverage.py
          check_base_references() ezt már conformance-blind módon
          hasonlítja (a vokabulárium NÉV-halmaza számít, a per-érték
          conformance nem) — 0 violation, verifikálva.

          IMPLEMENTATION CAPABILITY szinten viszont a `none`/
          `guest_managed` NEM egyenértékű a támogatott értékekkel: a
          kernel Access atom D-012 szabálya szerint egy `conformance:
          not_implemented` mezőre írt intentet a Relay futásidőben HARD
          REJECT-eli ("Silent acceptance is FORBIDDEN"). Vagyis a fenti
          intent séma-szinten érvényes marad, de a write ettől még
          runtime-ban elutasításra kerül ezen a specializáción — ez NEM
          Liskov substitution a viselkedés szintjén, csak a
          típus/vokabulárium szintjén. A #137 ezt a két szintet
          szándékosan szétválasztja (nem összemossa): coverage.py a
          TYPE-ot ellenőrzi, a conformance/D-012 a CAPABILITY-t —
          lásd thead11.
        contract:
          - type: enum
            expression:
              - unspecified
              - value: none
                conformance: not_implemented
              - provider_managed
              - customer_managed
              - value: guest_managed
                conformance: not_implemented

      - name: encryption_key_ref
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: string
        role: config
        optional: true
        capability: encryption
        description: >
          Titkosítási kulcs referencia (KMS key ID vagy path). OCI
          kmsKeyId — közvetlen. encryption_mode: customer_managed
          esetén releváns.

      - name: tags
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: collection
        collection_variant: list
        role: config
        optional: true
        capability: tagging
        description: >
          Platform tag-ek. OCI freeformTags + definedTags —
          normalizálható egységes listává.
        item_fields:
          - name: key
            shape_type: scalar
            scalar_type: string
            role: key
          - name: value
            shape_type: scalar
            scalar_type: string

  # ── StateSurface ──────────────────────────────────────────────────────────────
  state_surface:
    aggregate_ref: "cic:core:StateSurface@v0.2.0"
    source: storage-adapter
    freshness:
      ttl: 60s
      strategy: event-driven
    nodes:

      - name: attach_state
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: string
        role: state
        mandatory: true
        description: >
          Aktuális csatolási állapot — adapter normalizálja a platform
          értékeket. attaching/detaching: tranziens állapot. error: I/O
          hiba, adapter nem tudja kezelni a volume-ot. OCI-n nincs
          egyetlen mező — a VolumeAttachment.lifecycleState értékek
          aggregációjából vezethető le (nincs 1:1 megfelelő OCI
          enum-érték minden canonical állapotra).
        contract:
          - type: enum
            expression: [attached, detached, attaching, detaching, error, unknown]

      - name: attached_to
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: string
        semantic_type: cic-reference
        reference_target: "cic:compute:ComputeResource"
        role: state
        optional: true
        access:
          conformance: deprecated
        description: >
          ELAVULT (v0.1.3, öröklődik a canonicalból) — csak single-attach
          (access_mode: read_write_once) esetén megbízható. multi_attach
          módban használd az attachments listát. OCI-n
          VolumeAttachment.instanceId — csak single-attach esetén
          megbízható (a canonical mező is deprecated ugyanezen okból,
          lásd issue #15); multi_attach esetén az attachments listát kell
          használni.

      - name: attachments
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: collection
        collection_variant: list
        role: state
        optional: true
        description: >
          Aktuális csatolások — minden csatolt ComputeResource saját
          elemként, saját állapottal. OCI-n ListVolumeAttachments hívás
          eredményéből áll össze, nem egyetlen mezőből.
        item_fields:
          - name: target
            shape_type: scalar
            scalar_type: string
            semantic_type: cic-reference
            reference_target: "cic:compute:ComputeResource"
            role: key
            description: A csatolt ComputeResource address-e
          - name: state
            shape_type: scalar
            scalar_type: string
            contract:
              - type: enum
                expression: [attached, detached, attaching, detaching, error, unknown]
            description: Ennek az egy csatolásnak az állapota

      - name: size_actual_gb
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: integer
        role: state
        optional: true
        description: Tényleges volume méret (resize után frissül). OCI Volume.sizeInGBs — közvetlen.

      - name: usage_bytes
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: integer
        role: operational
        optional: true
        capability: usage_metrics
        description: >
          Felhasznált tárhely byte-ban (csak filesystem esetén
          értelmezett). Csak OCI Monitoring service-en keresztül érhető
          el (oci_blockstore metrikák), nem a Volume API-ból közvetlenül
          — külső observer szükséges hozzá.

      - name: iops_read
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: integer
        role: operational
        optional: true
        capability: usage_metrics
        description: OCI Monitoring service (VolumeReadThroughput/VolumeReadOps metrikák), nem a Volume API.

      - name: iops_write
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: integer
        role: operational
        optional: true
        capability: usage_metrics
        description: OCI Monitoring service (VolumeWriteThroughput/VolumeWriteOps metrikák), nem a Volume API.

      - name: health
        atomic_ref: "cic:core:Shape@v0.2.0"
        shape_type: scalar
        scalar_type: string
        role: state
        optional: true
        capability: health_monitoring
        description: >
          Az OCI Volume API-ban nincs közvetlen "health" mező — a
          lifecycle state (AVAILABLE/TERMINATING/FAULTY stb.) és az OCI
          Monitoring alarm-jelzések aggregációjából vezethető le, nem
          egyetlen API-hívásból.
        contract:
          - type: enum
            expression: [ok, degraded, failed, unknown]

  # ── OperationSurface ──────────────────────────────────────────────────────────
  operation_surface:
    aggregate_ref: "cic:core:OperationSurface@v0.2.0"
    operations:

      - name: attach
        atomic_ref: "cic:core:Behavior@v0.2.0"
        type: operation
        idempotent: false
        description: Volume csatolása compute resource-hoz. OCI AttachVolume — közvetlen.
        input:
          - name: target
            shape_type: scalar
            scalar_type: string
            mandatory: true
            description: ComputeResource address
        output:
          - name: attach_state
            shape_type: scalar
            scalar_type: string

      - name: detach
        atomic_ref: "cic:core:Behavior@v0.2.0"
        type: operation
        idempotent: true
        description: >
          Volume lecsatolása. multi_attach esetén target NEM opcionális a
          gyakorlatban. OCI DetachVolume — közvetlen.
        input:
          - name: target
            shape_type: scalar
            scalar_type: string
            semantic_type: cic-reference
            reference_target: "cic:compute:ComputeResource"
            optional: true
            description: >
              Melyik csatolást szüntesse meg — single-attach esetén
              elhagyható, multi_attach esetén a gyakorlatban kötelező.
          - name: force
            shape_type: scalar
            scalar_type: boolean
            default: false
        output:
          - name: attach_state
            shape_type: scalar
            scalar_type: string

      - name: delete
        atomic_ref: "cic:core:Behavior@v0.2.0"
        type: operation
        idempotent: false
        description: "Volume végleges törlése — MANUAL ONLY (confirm: mandatory). OCI DeleteVolume — közvetlen."
        input:
          - name: confirm
            shape_type: scalar
            scalar_type: boolean
            mandatory: true
            contract:
              - type: must
                expression: "confirm = true()"
                error_message: >
                  A törlés csak explicit confirm: true mellett hajtható
                  végre — confirm: false nem elfogadható bemenet, nem
                  "megerősítés hiánya".
        output: null

      - name: resize
        atomic_ref: "cic:core:Behavior@v0.2.0"
        type: operation
        idempotent: false
        capability: resize
        description: >
          Volume méret növelése. Csökkentés NEM támogatott
          (platform-agnosztikus korlát). OCI UpdateVolume(sizeInGBs) —
          OCI is csak növelést enged (nem lehet csökkenteni), ami
          pontosan megegyezik a canonical mező saját "resize kizárólag
          növelhet" kontraktusával (issue #17 must-szabálya) — jó
          szemantikai egyezés, a mezőnév/kifejezés-forma eltér
          (sizeInGBs vs. size_gb), de a shape (integer, must-kontraktus)
          változatlan marad itt is.
        input:
          - name: size_gb
            shape_type: scalar
            scalar_type: integer
            mandatory: true
            contract:
              - type: must
                expression: "size_gb >= ../../state_surface/size_actual_gb"
                error_message: >
                  size_gb nem lehet kisebb, mint a jelenlegi
                  size_actual_gb — resize kizárólag növelhet.
        output:
          - name: size_actual_gb
            shape_type: scalar
            scalar_type: integer

      - name: snapshot
        atomic_ref: "cic:core:Behavior@v0.2.0"
        type: operation
        idempotent: false
        capability: snapshot
        description: >
          Pillanatkép készítése — az eredmény egy adapter-specifikus
          snapshot ref. A snapshot NEM önálló StorageResource. OCI
          CreateVolumeBackup — más objektum-modell: az eredmény egy OCI
          Boot/Volume Backup resource, nem maga a StorageResource.
        input:
          - name: snapshot_name
            shape_type: scalar
            scalar_type: string
            mandatory: true
        output:
          - name: snapshot_ref
            shape_type: scalar
            scalar_type: string

  # ── NotificationSurface ───────────────────────────────────────────────────────
  # Explicit full restatement — check_coverage() (tools/registrylib/coverage.py)
  # DomainComposition/identity.base esetén megköveteli, hogy minden base-beli
  # mező (itt: notification_surface.events) megjelenjen, legalább
  # access.conformance: not_implemented formában. OCI-specifikus narrowing
  # egyik eseményhez sem szükséges — mindhárom közvetlenül leképezhető.
  notification_surface:
    events:
      - name: attach-state-changed
        atomic_ref: "cic:core:Event@v0.2.0"
        trigger: state_change
        severity: info
        description: Csatolási állapot megváltozott
        payload:
          - name: previous_state
            shape_type: scalar
            scalar_type: string
          - name: current_state
            shape_type: scalar
            scalar_type: string
          - name: attached_to
            shape_type: scalar
            scalar_type: string
            optional: true

      - name: threshold-exceeded
        atomic_ref: "cic:core:Event@v0.2.0"
        trigger: threshold
        severity: warning
        capability: usage_metrics
        description: >
          Tárhely kihasználtság küszöböt átlépett. OCI Monitoring
          alarm-jelzésből származtatott — lásd usage_bytes mező.
        payload:
          - name: usage_bytes
            shape_type: scalar
            scalar_type: integer
          - name: size_bytes
            shape_type: scalar
            scalar_type: integer

      - name: health-degraded
        atomic_ref: "cic:core:Event@v0.2.0"
        trigger: state_change
        severity: warning
        capability: health_monitoring
        description: >
          Volume egészségi állapot romlott. OCI-n a lifecycle state és
          az OCI Monitoring alarm-jelzések aggregációjából származtatott
          — lásd health mező.
        payload:
          - name: previous_health
            shape_type: scalar
            scalar_type: string
          - name: current_health
            shape_type: scalar
            scalar_type: string

  # ── BindingSurface (teljes restatement, #131/thead12) ───────────────────────────
  # addresses.key_fields + adapter + adapter_capabilities mind kiadva,
  # lásd a fájl description-jét a két eltérő öröklési szemantikáról.
  binding_surface:
    addresses:
      - atomic_ref: "cic:core:Address@v0.2.0"
        schema_path: "/cic-storage:volumes/volume={backend}, {provider}, {location}, {id}"
        api_path: "/restconf/data/cic-storage:volumes/volume={backend}, {provider}, {location}, {id}"
        logical_id: "cic:storage:{backend}:{provider}:{location}:{id}"
        namespace: "cic:storage"
        key_fields:
          - name: backend
            atomic_ref: "cic:core:Shape@v0.2.0"
            shape_type: scalar
            scalar_type: string
            role: key
            mandatory: true
            contract:
              - type: enum
                expression:
                  - value: hypervisor
                    conformance: not_implemented
                  - value: san
                    conformance: not_implemented
                  - cloud
            description: >
              Ezen a specializáción ténylegesen csak `cloud` fordul elő
              (OCI maga egy cloud provider) -- a `hypervisor`/`san`
              értékek a bázis teljes vokabuláriumának RÉSZEI maradnak
              (TYPE/VOCABULARY szinten, #137/thead11), csak ezen a
              specializáción nem implementáltak (IMPLEMENTATION
              CAPABILITY szinten, D-012).
          - name: provider
            atomic_ref: "cic:core:Shape@v0.2.0"
            shape_type: scalar
            scalar_type: string
            role: key
            mandatory: true
            description: >
              Ezen a specializáción gyakorlatilag mindig `oci` -- de ez
              NEM `default`-tal jelölve, mert egy `role: key` mező
              azonosítóját a hívónak kell megadnia, sosem lehet
              implicit (C13, proposals/atom-grammar). Szándékosan
              NINCS Contract-enummal sem szűkítve (lásd a fájl
              description-jét, thead12): a bázison a `provider` mező
              jelentése a `backend` értékétől függő, ezért ott sincs
              feltétlen Contract-enum rajta, csak próza -- Contract-ot
              ide tenni tévesen a hypervisor/san eseteket is a
              cloud-enumra korlátozná a bázison.
          - name: location
            atomic_ref: "cic:core:Shape@v0.2.0"
            shape_type: scalar
            scalar_type: string
            role: key
            mandatory: true
            description: >
              OCI region (pl. eu-frankfurt-1) -- a bázis "cloud:
              provider region" leírásának OCI-specifikus pontosítása.
          - name: id
            atomic_ref: "cic:core:Shape@v0.2.0"
            shape_type: scalar
            scalar_type: string
            role: key
            mandatory: true
            description: >
              OCI Volume OCID (pl.
              ocid1.volume.oc1.eu-frankfurt-1.abc...) -- a bázis "cloud:
              cloud volume ID" leírásának OCI-specifikus pontosítása.
    adapter: storage-adapter
    adapter_capabilities:
      known_adapters:
        - name: storage-adapter
          backend: cloud
          provider: oci
          capabilities: [encryption, snapshot, resize, tagging, usage_metrics]
