---
name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          # Full history, not the default shallow depth-1 clone: `make
          # registry.latest` walks each enrolled schema file's git log to
          # find its original add commit, which a shallow clone can't see.
          fetch-depth: 0

      - name: Build Docker images
        run: make build

      - name: Generate and check requirements.txt for drift
        run: |
          make infra.deps
          git diff --exit-code requirements.txt

      - name: Start development environment
        run: make up

      - name: Run code quality checks
        run: make check

      - name: Run tests
        run: make test

      - name: Generate coverage report
        run: make infra.coverage

      # No "make validate" step here on purpose: it runs
      # tools.compiler validate, which only load-tests a legacy bundle
      # template (schemas/index.yaml) left over from before the
      # per-file registry model -- it never reads the real
      # general/standards/providers corpus at all. Running it as a CI
      # gate under a name like "Validate schema corpus" claimed
      # coverage that didn't exist (cic-schema-registry#74). The step
      # below is the one that actually reads the real corpus.

      - name: Validate registry (base-chain coverage + version evolution)
        run: make registry.validate

      - name: Check schema version discipline (LATEST.yaml + frozen-file guard)
        run: make registry.latest

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: html-coverage-report
          path: htmlcov/
          # Explicit, not the action's silent "warn" default: if
          # htmlcov/ is ever missing again (#69 — this whole step used
          # to run against a directory that was never generated,
          # warning instead of failing, so it stayed green for the
          # entire history of this repo), the build must fail loudly
          # instead of silently uploading nothing.
          if-no-files-found: error

      - name: Stop development environment
        if: always()
        run: make down
